<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Tree Game</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="ui">

  <h2>🌳 GOLDEN TREE</h2>

  <canvas id="gameCanvas" width="900" height="250"></canvas>
  <canvas id="fxCanvas"></canvas>

  <div class="bets">
    <button onclick="setBet(300)">300</button>
    <button onclick="setBet(600)">600</button>
    <button onclick="setBet(900)">900</button>
    <button onclick="setBet(1200)">1200</button>
    <button onclick="setBet(1500)">1500</button>
    <button onclick="setBet(3000)">3000</button>
  </div>

  <button id="spin">SPIN</button>

  <div id="result"></div>
  <div>الرصيد: <span id="balance">1000</span></div>

</div>

<script src="script.js"></script>

</body>
</html>
