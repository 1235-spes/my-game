<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Tree</title>

  <link rel="stylesheet" href="golden-tree.css">
  <style>
    body { background:#050505; color:white; font-family:Arial,sans-serif; text-align:center; margin:0; padding:0;}
    .top-bar { display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:#222; }
    .controls { margin:15px; }
    button { padding:10px 15px; margin:5px; font-size:16px; cursor:pointer; border-radius:8px; }
    canvas { display:block; margin:0 auto; background:#000; border:2px solid #444; }
    #result { margin-top:10px; font-size:20px; font-weight:bold; color:#FFD700; }
  </style>
</head>

<body>

  <!-- رأس اللعبة -->
  <div class="top-bar">
    <button onclick="goBack()">⬅ رجوع</button>
    <h2>🎰 Golden Tree</h2>
    <div id="balanceBox">الرصيد: 0</div>
  </div>

  <!-- الكانفس -->
  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <!-- أزرار الرهان -->
  <div class="controls">
    <button onclick="setBet(300)">300</button>
    <button onclick="setBet(600)">600</button>
    <button onclick="setBet(1000)">1000</button>
  </div>

  <!-- زر التشغيل -->
  <button id="spin">SPIN 🎲</button>

  <!-- النتيجة -->
  <div id="result"></div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
  // ===== إعداد اللعبة =====
  let selectedBet = 300;
  const COLS = 5;
  const ROWS = 4;
  let canvas, ctx, spinning=false, images={}, grid=[], balanceBox;
  const SYMBOLS = [
    { name: "tree", img: "images/IMG_٢٠٢٦٠٦١٠_٢٢٥٨٢٢.jpg", rarity: 0.05, reward: 50 },
    { name: "grape", img: "images/IMG_٢٠٢٦٠٦١٠_٢٢٥٩٤٣.jpg", rarity: 0.15, reward: 5 },
    { name: "orange", img: "images/IMG_٢٠٢٦٠٦١٠_٢٣٠٠١١.jpg", rarity: 0.15, reward: 5 },
    { name: "peach", img: "images/IMG_٢٠٢٦٠٦١٠_٢٣٠١٢٩.jpg", rarity: 0.15, reward: 5 },
    { name: "seven", img: "images/IMG_٢٠٢٦٠٦١٠_٢٣٠٢٢٠.jpg", rarity: 0.07, reward: 100 },
    { name: "cherry", img: "images/IMG_٢٠٢٦٠٦١٠_٢٣٠٥٠١.jpg", rarity: 0.15, reward: 5 },
    { name: "bell", img: "images/IMG_٢٠٢٦٠٦١٠_٢٣٠٥٣٨.jpg", rarity: 0.10, reward: 20 },
    { name: "gum", img: "images/IMG_٢٠٢٦٠٦١٠_٢٣٠٦٣٠.jpg", rarity: 0.13, reward: 3 },
    { name: "dollar", img: "images/IMG_٢٠٢٦٠٦١٠_٢٣٠٧٥٦.jpg", rarity: 0.05, reward: 10 }
  ];

  // ===== Firebase =====
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const userId = "user_1";
  window.userRef = database.ref("users/" + userId);

  // إنشاء المستخدم إذا لم يكن موجود
  userRef.once("value").then(snap=>{
    if(!snap.exists()){
      userRef.set({balance:1000, earnings:0, wins:0});
    }
  });

  // تحديث الرصيد تلقائي
  userRef.on("value", snap=>{
    const user = snap.val();
    if(user) balanceBox.innerText = "الرصيد: " + user.balance;
  });

  // ===== الوظائف الأساسية =====
  function loadImages(callback){
    let loaded=0;
    SYMBOLS.forEach(s=>{
      const img=new Image();
      img.src=s.img;
      img.onload=()=>{loaded++; if(loaded===SYMBOLS.length) callback();}
      images[s.name]=img;
    });
  }

  function getRandomSymbol(col,row){
    let pool = SYMBOLS.filter(s => !(s.name==="tree" && (row===0||row===ROWS-1)));
    let total = pool.reduce((a,b)=>a+b.rarity,0);
    let rand = Math.random()*total;
    let sum=0;
    for(let s of pool){
      sum+=s.rarity;
      if(rand<=sum) return s;
    }
    return pool[0];
  }

  function generateGrid(){
    grid=[];
    for(let c=0;c<COLS;c++){
      let col=[];
      for(let r=0;r<ROWS;r++) col.push(getRandomSymbol(c,r));
      grid.push(col);
    }
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const size=90;
    for(let c=0;c<COLS;c++){
      for(let r=0;r<ROWS;r++){
        let symbol = grid[c][r];
        let x=c*size+50;
        let y=r*size+30;
        ctx.drawImage(images[symbol.name],x,y,70,70);
      }
    }
  }

  function calculateWin(){
    let totalWin=0, counts={};
    for(let col of grid) for(let s of col) counts[s.name]=(counts[s.name]||0)+1;
    for(let key in counts){
      if(counts[key]>=3){
        let symbol = SYMBOLS.find(s=>s.name===key);
        let win = symbol.reward*selectedBet;
        if(key==="dollar") win*=10;
        if(key==="seven") win*=50;
        totalWin+=win;
      }
    }
    return totalWin;
  }

  function updateBalanceUI(balance){
    if(balanceBox) balanceBox.innerText="الرصيد: "+balance;
  }

  async function spin(){
    if(spinning) return;
    spinning=true;
    let snap = await userRef.once("value");
    let user = snap.val();
    if(!user || user.balance<selectedBet){
      alert("رصيدك غير كافي!");
      spinning=false; return;
    }
    let balance = user.balance - selectedBet;
    updateBalanceUI(balance);
    generateGrid(); draw();

    setTimeout(async()=>{
      let win = calculateWin();
      balance += win;
      document.getElementById("result").innerText = win>0? "فزت: "+win : "حظ أوفر المرة القادمة!";
      await userRef.update({
        balance: balance,
        earnings: (user.earnings||0)+win,
        wins: (user.wins||0)+(win>0?1:0)
      });
      spinning=false;
    },1200);
  }

  function setBet(amount){ selectedBet=amount; }
  window.setBet=setBet;

  function goBack(){ alert("يمكنك إضافة وظيفة العودة هنا"); }

  window.addEventListener("load",()=>{
    canvas = document.getElementById("gameCanvas");
    ctx = canvas.getContext("2d");
    balanceBox = document.getElementById("balanceBox");

    loadImages(()=>{generateGrid(); draw();});

    document.getElementById("spin").addEventListener("click", spin);
  });

  </script>
</body>
</html>
