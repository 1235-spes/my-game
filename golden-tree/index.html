
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Tree Canvas Casino</title>
<link rel="stylesheet" href="style.css">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

</head>
<body>

<div class="ui">
  <h2>🌳 GOLDEN TREE CANVAS</h2>

  <canvas id="gameCanvas" width="900" height="250"></canvas>
  <canvas id="fxCanvas"></canvas>

  <input type="number" id="bet" placeholder="أدخل الرهان">
  <button id="spin">SPIN</button>

  <div id="result"></div>
  <div>رصيدك: <span id="balance">0</span></div>

  <audio id="spinSound" src="spin.mp3"></audio>
  <audio id="tickSound" src="tick.mp3"></audio>
  <audio id="winSound" src="win.mp3"></audio>
  <audio id="boomSound" src="boom.mp3"></audio>
</div>

<script src="script.js"></script>
</body>
</html>
