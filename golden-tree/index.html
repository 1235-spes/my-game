<!-- 🎮 GAME SECTION -->
<div id="game-section" style="display:none; padding:20px;">

  <h2 style="color:#FFD700; margin-bottom:10px;">🌳 GOLDEN TREE GAME</h2>

  <canvas id="gameCanvas" width="900" height="250" style="background:#111;border:2px solid gold;border-radius:15px;"></canvas>
  <canvas id="fxCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;"></canvas>

  <!-- الرهانات الجاهزة -->
  <div class="bet-buttons" style="margin-top:10px;">
    <button class="bet-btn" onclick="selectBet(300)">300</button>
    <button class="bet-btn" onclick="selectBet(600)">600</button>
    <button class="bet-btn" onclick="selectBet(900)">900</button>
    <button class="bet-btn" onclick="selectBet(1200)">1.2K</button>
    <button class="bet-btn" onclick="selectBet(3000)">3K</button>
    <button class="bet-btn" onclick="selectBet(10000)">10K</button>
    <button class="bet-btn" onclick="selectBet(50000)">50K</button>
    <button class="bet-btn" onclick="selectBet(100000)">100K</button>
    <button class="bet-btn" onclick="selectBet(500000)">500K</button>
    <button class="bet-btn" onclick="selectBet(1500000)">1.5M</button>
  </div>

  <button id="spin" style="padding:10px 20px;background:gold;border:none;border-radius:10px;font-weight:bold;margin-top:10px;">ابدأ اللعبة</button>

  <div id="result" style="margin-top:10px;color:white;font-size:18px;"></div>
  <div>رصيدك: <span id="balance">1000</span></div>

</div>
