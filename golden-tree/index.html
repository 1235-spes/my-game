<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الشجرة الذهبية</title>
  <link rel="stylesheet" href="golden-tree.css">
</head>
<body>
<div class="game-container">
  <div id="game-section">
    <h1 class="game-title">
  <img src="../images/shaaar.png" alt="Golden Tree Logo" class="game-logo">
</h1>
    <div class="reels">
      <div class="reel" id="reel1"></div>
      <div class="reel" id="reel2"></div>
      <div class="reel" id="reel3"></div>
      <div class="reel" id="reel4"></div>
      <div class="reel" id="reel5"></div>
    </div>

    <div class="bet-buttons">
      <button data-bet="300">300</button>
      <button data-bet="500">500</button>
      <button data-bet="1000">1000</button>
      <button data-bet="5000">5000</button>
      <button data-bet="8000">8000</button>
    </div>

    <div class="controls">
  <button id="spin" class="spin-btn">
   <img src="../images/Zr.jpg" alt="Spin"> 
  </button>
</div>

    <div class="info">
      الرهان: <span id="bet">300</span>
      الرصيد: <span id="balance">0</span>
    </div>
  </div>
</div>
