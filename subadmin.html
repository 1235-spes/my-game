<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sub Admin Panel</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:white;
}

.header{
  background:#181818;
  padding:20px;
  text-align:center;
  font-size:26px;
  font-weight:bold;
  color:#FFD700;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#181818;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
  border:1px solid rgba(255,215,0,.2);
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:10px;
  background:#242424;
  color:white;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
}

.create{
  background:#FFD700;
  color:black;
}

.logout{
  background:#ff4444;
  color:white;
}

.balance-box{
  font-size:20px;
  color:#FFD700;
  margin-bottom:10px;
}

.user-card{
  background:#222;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
}
</style>

</head>
<body>

<div class="header">لوحة السوبر ادمن</div>

<div class="container">

  <div class="card">
    <div class="balance-box">
      رصيدك: <span id="balance">0</span>
    </div>

    <button class="logout" onclick="logout()">تسجيل خروج</button>
  </div>

  <div class="card">
    <h3>إنشاء لاعب</h3>

    <input id="userName" placeholder="اسم اللاعب">
    <input id="userPass" placeholder="كلمة المرور">
    <input id="userBalance" type="number" placeholder="الرصيد">

    <button class="create" onclick="createUser()">إنشاء لاعب</button>
  </div>

  <div class="card">
    <h3>اللاعبين</h3>
    <div id="usersList"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script src="subadmin.js"></script>

</body>
</html>
