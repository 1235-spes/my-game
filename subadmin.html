<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Sub Admin</title>

<style>
body{background:#0d0d0d;color:white;font-family:Arial;padding:20px}
.card{background:#181818;padding:15px;border-radius:15px;margin-bottom:10px}
input{width:100%;padding:10px;margin:5px 0;background:#222;color:white;border:none;border-radius:10px}
button{width:100%;padding:10px;background:#FFD700;border:none;border-radius:10px;font-weight:bold}
</style>
</head>

<body>

<h2>لوحة Sub Admin</h2>

<div class="card">
رصيدك: <span id="balance">0</span>
</div>

<h3>إنشاء لاعب</h3>

<input id="u" placeholder="اسم اللاعب">
<input id="p" placeholder="كلمة المرور">
<input id="b" type="number" placeholder="رصيد">

<button onclick="createUser()">إنشاء</button>

<div id="status"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIza...",
  authDomain:"chanci-app.firebaseapp.com",
  databaseURL:"https://chanci-app-default-rtdb.firebaseio.com"
});

const db = firebase.database();
const user = localStorage.getItem("currentUser");

// تحميل رصيد subAdmin
db.ref("subAdmins/" + user).get().then(s=>{
  document.getElementById("balance").innerText = s.val().balance;
});

// إنشاء لاعب
function createUser(){

  const name = document.getElementById("u").value;
  const pass = document.getElementById("p").value;
  const bal = Number(document.getElementById("b").value || 0);

  const ref = db.ref("subAdmins/" + user);

  ref.get().then(s=>{

    const sa = s.val();

    if(bal > sa.balance){
      document.getElementById("status").innerText = "رصيد غير كافي";
      return;
    }

    ref.update({
      balance: sa.balance - bal
    });

    db.ref("users/" + name).set({
      password: pass,
      balance: bal,
      role: "user"
    });

    document.getElementById("status").innerText = "تم إنشاء اللاعب";
  });
}
</script>

</body>
</html>
