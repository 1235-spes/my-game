<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub Admin Panel</title>

<style>
body{background:#0d0d0d;color:white;font-family:Arial}
.header{background:#181818;padding:20px;text-align:center;color:#FFD700;font-size:26px}
.container{max-width:1200px;margin:auto;padding:20px}

.box{
background:#181818;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

.input{
width:100%;
padding:10px;
margin:5px 0;
background:#252525;
border:none;
color:white;
border-radius:8px;
}

.btn{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
font-weight:bold;
}

.create{background:#FFD700;color:black}
.logout{background:#ff4444;color:white}

.user-card{
background:#222;
padding:15px;
margin:10px 0;
border-radius:10px;
border:1px solid rgba(255,215,0,.2);
}
</style>

</head>
<body>

<div class="header">لوحة Sub Admin</div>

<div class="container">

<div class="box">
<h2>إنشاء مستخدم</h2>

<input id="newUser" class="input" placeholder="اسم المستخدم">
<input id="newPass" class="input" placeholder="كلمة المرور">
<input id="newBalance" class="input" type="number" placeholder="الرصيد">

<button class="btn create" onclick="createUser()">إنشاء</button>
<button class="btn logout" onclick="logout()">تسجيل خروج</button>

<div id="status"></div>
</div>

<div class="box">
<h2>المستخدمين</h2>
<div id="usersList"></div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script src="subadmin.js"></script>

</body>
</html>
