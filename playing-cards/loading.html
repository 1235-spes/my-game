<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Loading...</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: url("../images/خلفية.لعبة.خامسة.jpg") center/cover no-repeat fixed;

  display: flex;
  justify-content: center;
  align-items: center;
  color: gold;
  font-family: Arial;
}

.container {
  text-align: center;
  width: 80%;
}

.logo {
  width: 120px;
  margin-bottom: 20px;
  filter: drop-shadow(0 0 10px gold);
}

.loading-box {
  width: 100%;
  height: 25px;
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid gold;
}

.bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, gold, orange);
  transition: width 0.2s ease;
}

.percent {
  margin-top: 15px;
  font-size: 22px;
  font-weight: bold;
}

.text {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.8;
}
</style>

</head>
<body>

<div class="container">

  <!-- شعار اللعبة -->
  <img class="logo" src="../images/IMG_٢٠٢٦٠٦١٠_٠٠٣٧٢١.png">

  <!-- شريط التحميل -->
  <div class="loading-box">
    <div class="bar" id="bar"></div>
  </div>

  <!-- النسبة -->
  <div class="percent" id="percent">0%</div>

  <div class="text">جاري تحميل اللعبة...</div>

</div>

<script>
let progress = 0;

let interval = setInterval(() => {

  progress += Math.random() * 6; // تحميل واقعي

  if (progress > 100) progress = 100;

  document.getElementById("bar").style.width = progress + "%";
  document.getElementById("percent").innerText = Math.floor(progress) + "%";

  if (progress >= 100) {
    clearInterval(interval);

    setTimeout(() => {
      window.location.href = "playing-cards.html";
    }, 500);
  }

}, 120);
</script>

</body>
</html>
