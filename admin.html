<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<style>
body{
margin:0;
font-family:Arial;
background:#0c0c0c;
color:#fff;
}

.box{
padding:20px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
}

button{
padding:10px;
width:100%;
background:gold;
border:none;
}
</style>
</head>
<body>

<div class="box">
<h2>ADMIN PANEL</h2>

<input id="user" placeholder="User email">
<input id="pass" placeholder="Password">
<input id="balance" placeholder="Balance">

<button onclick="create()">Create User</button>

<div id="list"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBsx_iEGWKEDlEQe6B2rz4yKAhGdz1uas",
  authDomain: "chanci-app.firebaseapp.com",
  databaseURL: "https://chanci-app-default-rtdb.firebaseio.com",
  projectId: "chanci-app",
  storageBucket: "chanci-app.firebasestorage.app",
  messagingSenderId: "18416485348",
  appId: "1:18416485348:web:12176965505080897b3df1"
};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig);
}

const db = firebase.database();

function create(){
let email = document.getElementById("user").value;
let pass = document.getElementById("pass").value;
let bal = document.getElementById("balance").value;

db.ref("adminUsers").push({
email, pass, balance:bal
});

alert("User created");
}
</script>

</body>
</html>
