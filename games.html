<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanci | الألعاب</title>

<link rel="stylesheet" href="dashboard.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="profile">

        <img
        class="avatar"
        src="https://i.imgur.com/5cLDe6X.png"
        />

        <div class="username" id="username">...</div>

        <div class="member">
            عضو ذهبي
        </div>

        <div class="menu-item logout"
        onclick="logout()">
            تسجيل خروج
        </div>

    </div>

    <div class="menu-item"
    onclick="location.href='dashboard.html'">
        الرئيسية
    </div>

    <div class="menu-item"
    onclick="location.href='wallet.html'">
        المحفظة
    </div>

    <div class="menu-item active">
        الألعاب
    </div>

    <div class="menu-item"
    onclick="location.href='withdraw.html'">
        السحوبات
    </div>

    <div class="menu-item"
    onclick="location.href='settings.html'">
        الإعدادات
    </div>

</div>

<!-- MAIN -->
<div class="main">

    <!-- TOP BAR -->
    <div class="top-bar">

        <button class="menu-btn"
        onclick="toggleSidebar()">
            ☰
        </button>

    </div>

    <!-- WALLET BAR -->
    <div class="wallet-bar">

        <div>
            💰 <span id="top-balance">0</span>
        </div>

        <div>
            🏆 VIP GOLD
        </div>

    </div>

    <!-- HERO -->
    <div class="hero">

        <div class="hero-content">

            <div class="hero-logo">

                <img
                src="images/IMG_٢٠٢٦٠٦١٠_٠٠٣٧٢١.png"
                alt="Chanci App">

            </div>

        </div>

    </div>

    <!-- GAMES -->
    <div class="games-section">

        <h2 class="section-title">
            🎮 الألعاب
        </h2>

        <div class="games-grid">

            <div class="game-card"
            onclick="openGoldenTree()">

                <img class="game-image"
                src="images/IMG_٢٠٢٦٠٦١٠_٠٠٣٩٢٤.jpg">

                <div class="game-name">
                    Golden Tree
                </div>

            </div>

            <div class="game-card">

                <img class="game-image"
                src="images/IMG_٢٠٢٦٠٦١٠_١٦٣٥٣٢.png">

                <div class="game-name">
                    Coin Flip
                </div>

            </div>

            <div class="game-card">

                <img class="game-image"
                src="images/IMG_2260610_163759.png">

                <div class="game-name">
                    Fortune Wheel
                </div>

            </div>

            <div class="game-card">

                <img class="game-image"
                src="images/IMG_٢٠٢٦٠٦١٠_١٦٣٩٢١.png">

                <div class="game-name">
                    Treasure Box
                </div>

            </div>

        </div>

    </div>

</div>

<script src="games.js"></script>

</body>
</html>
