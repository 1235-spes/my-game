<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الألعاب الاحترافية</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: Arial, sans-serif;}
body{background: linear-gradient(135deg,#0f172a,#1e293b);color:white;overflow-x:hidden;}

/* HEADER */
header{
  display:flex; justify-content:space-between; align-items:center;
  padding:20px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); position:sticky; top:0;
}
.logo{font-size:24px; font-weight:bold; color:#facc15; animation: fadeDown 1s ease;}
.balance{background:#22c55e; padding:10px 15px; border-radius:12px; font-weight:bold; animation: pulse 2s infinite;}

/* MAIN CONTAINER */
.container{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-top:20px;
}

/* CARDS */
.card{
  background: rgba(255,255,255,0.08);
  padding:20px;
  border-radius:15px;
  text-align:center;
  transition:0.3s;
  cursor:pointer;
  animation: fadeUp 0.8s ease;
}
.card:hover{
  transform:translateY(-8px) scale(1.03);
  background: rgba(255,255,255,0.15);
}

/* BUTTONS */
button{
  margin-top:10px;
  padding:10px 15px;
  border:none; border-radius:10px;
  background:#38bdf8; color:black; font-weight:bold; cursor:pointer; transition:0.3s;
}
button:hover{background:#0ea5e9; transform:scale(1.05);}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0; transform:translateY(20px);}to{opacity:1; transform:translateY(0);}}
@keyframes fadeDown{from{opacity:0; transform:translateY(-20px);}to{opacity:1; transform:translateY(0);}}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}

/* MODAL */
.modal{
  position:fixed; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.7);
  display:none; justify-content:center; align-items:center;
}
.modal-content{
  background:#1e293b; padding:20px; border-radius:15px; width:300px; text-align:center;
  animation: fadeUp 0.5s ease;
}
</style>
</head>
<body>

<header>
  <div class="logo">🎮 لوحة الألعاب</div>
  <div class="balance">💰 الرصيد: 0</div>
</header>

<div class="container">
  <div class="card">
    <h3>🎡 عجلة الحظ</h3>
    <button onclick="openModal()">تشغيل</button>
  </div>
  <div class="card">
    <h3>🎁 المكافآت</h3>
    <button>استلام</button>
  </div>
  <div class="card">
    <h3>👤 الحساب</h3>
    <button>عرض</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3>🎡 قريباً!</h3>
    <p>سيتم إضافة عجلة الحظ</p>
    <button onclick="closeModal()">إغلاق</button>
  </div>
</div>

<script>
function openModal(){document.getElementById("modal").style.display="flex";}
function closeModal(){document.getElementById("modal").style.display="none";}
</script>

</body>
</html>
