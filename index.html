<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanci-App | تسجيل الدخول</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#050505,#111,#1a1a1a);padding:20px;}
.login-box{width:100%;max-width:450px;background:#141414;border:1px solid rgba(255,215,0,.25);border-radius:20px;padding:30px;box-shadow:0 0 30px rgba(255,215,0,.15);}
.logo{text-align:center;font-size:42px;font-weight:900;color:#FFD700;margin-bottom:10px;text-shadow:0 0 10px rgba(255,215,0,.6);}
.subtitle{text-align:center;color:#ccc;margin-bottom:25px;}
input{width:100%;padding:14px;margin-bottom:15px;border:none;outline:none;border-radius:12px;background:#242424;color:#fff;font-size:15px;}
input:focus{box-shadow:0 0 10px rgba(255,215,0,.4);}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#FFD700;color:#000;font-weight:bold;font-size:16px;cursor:pointer;transition:.3s;}
button:hover{transform:translateY(-2px);box-shadow:0 0 15px rgba(255,215,0,.4);}
.status{margin-top:15px;text-align:center;color:#ffcc00;font-size:14px;}
</style>
</head>
<body>

<div class="login-box">
  <div class="logo">CHANCI APP</div>
  <div class="subtitle">قم بتسجيل الدخول للمتابعة</div>
  <input type="text" id="username" placeholder="اسم المستخدم">
  <input type="password" id="password" placeholder="كلمة المرور">
  <button onclick="login()">تسجيل الدخول</button>
  <div class="status" id="status"></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBsx_iEGWKEDlEQe6B2rz4yqKAhGdz1uas",
  authDomain: "chanci-app.firebaseapp.com",
  databaseURL: "https://chanci-app-default-rtdb.firebaseio.com",
  projectId: "chanci-app",
  storageBucket: "chanci-app.firebasestorage.app",
  messagingSenderId: "18416485348",
  appId: "1:18416485348:web:918a393569acb47a7b3df1",
  measurementId: "G-S8ZCNJBFQ8"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const currentUser = localStorage.getItem("currentUser");
if(currentUser){
  window.location.href = currentUser === "doktor" ? "admin.html" : "dashboard.html";
}

function login(){
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const status = document.getElementById("status");

  if(username === "" || password === ""){
    status.innerHTML = "يرجى إدخال اسم المستخدم وكلمة المرور";
    return;
  }

  status.innerHTML = "جاري تسجيل الدخول...";

  db.ref("users/" + username).get().then(snapshot=>{
    if(!snapshot.exists()){
      status.innerHTML = "اسم المستخدم غير موجود";
      return;
    }
    const user = snapshot.val();
    if(String(user.password) === String(password)){
      localStorage.setItem("currentUser", username);
      status.innerHTML = "تم تسجيل الدخول بنجاح";
      setTimeout(()=>{
        window.location.href = username === "doktor" ? "admin.html" : "dashboard.html";
      },500);
    } else {
      status.innerHTML = "كلمة المرور غير صحيحة";
    }
  }).catch(error=>{
    status.innerHTML = "حدث خطأ أثناء تسجيل الدخول";
    console.error(error);
  });
}
 function login(username, password) {

  db.ref("users/" + username).get().then(u => {

    if (u.exists() && u.val().password === password) {
      localStorage.setItem("currentUser", username);
      window.location.href = "game.html";
      return;
    }

    db.ref("superAdmins/" + username).get().then(sa => {

      if (sa.exists() && sa.val().password === password) {
        localStorage.setItem("currentUser", username);
        window.location.href = "superadmin.html";
        return;
      }

      if (username === "doktor" && password === "1234") {
        localStorage.setItem("login ;
        window.location.href = "admin.html";
        return;
      }

      alert("اسم المستخدم غير موجود");

    });

  });

}
</script>
</body>
</html>
