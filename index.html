<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanci App</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background: radial-gradient(circle at top, #1a1a1a, #000);
    color:white;
    text-align:center;
}

/* خلفية ذهبية خفيفة */
.gold-bg{
    background: url('https://images.unsplash.com/photo-1610375461246-83df859d849d?q=80&w=1200') center/cover;
    min-height:100vh;
}

/* طبقة شفافة */
.overlay{
    background: rgba(0,0,0,0.75);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* الكرت الرئيسي */
.card{
    width:100%;
    max-width:420px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius:20px;
    padding:25px;
    border:1px solid rgba(255,215,0,0.3);
    box-shadow:0 0 30px rgba(255,215,0,0.2);
}

/* العنوان */
.logo{
    font-size:28px;
    font-weight:bold;
    color:gold;
    margin-bottom:20px;
}

/* الحقول */
input{
    width:90%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    outline:none;
}

/* أزرار */
button{
    width:90%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

/* زر الدخول */
.login{
    background: linear-gradient(45deg, gold, orange);
    color:black;
}

/* زر خروج */
.logout{
    background: linear-gradient(45deg, #ff4d4d, #b30000);
    color:white;
}

/* الرصيد */
.balance{
    margin:15px 0;
    padding:15px;
    border-radius:15px;
    background: rgba(255,215,0,0.1);
    border:1px solid rgba(255,215,0,0.3);
    font-size:18px;
}

/* الأقسام */
.section{
    margin-top:15px;
}

.game-btn{
    background: rgba(255,255,255,0.1);
    color:white;
}

.game-btn:hover{
    background: rgba(255,215,0,0.2);
}

.hidden{display:none;}

</style>
</head>

<body class="gold-bg">

<div class="overlay">

<div class="card">

    <div class="logo">💰 Chanci Gold App</div>

    <!-- تسجيل الدخول -->
    <div id="loginBox">
        <input id="username" placeholder="اسم المستخدم">
        <input id="password" type="password" placeholder="كلمة المرور">
        <button class="login" onclick="login()">دخول</button>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboard" class="hidden">

        <div class="balance">
            💰 رصيدك: <span id="balance">0</span> عملة ذهبية
        </div>

        <button class="logout" onclick="logout()">تسجيل خروج</button>

        <div class="section">
            <h3>🎮 الألعاب</h3>
            <button class="game-btn">🎁 صندوق الذهب</button>
            <button class="game-btn">🎰 عجلة الحظ</button>
        </div>

        <div class="section">
            <h3>🏆 السحب اليومي</h3>
            <button class="game-btn">دخول السحب</button>
        </div>

    </div>

</div>

</div>

<script>

// 🔥 Firebase config (ضع مشروعك هنا)
const firebaseConfig = {
  databaseURL: "https://chanci-app-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function login(){

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if(!username || !password){
        alert("أدخل البيانات كاملة");
        return;
    }

    // 🔐 تحقق من المستخدم الحقيقي
    db.ref("users/" + username).once("value")
    .then(snapshot => {

        if(snapshot.exists()){
            let data = snapshot.val();

            // 🔒 كلمة المرور شرط أساسي
            if(data.password === password){

                document.getElementById("loginBox").classList.add("hidden");
                document.getElementById("dashboard").classList.remove("hidden");

                document.getElementById("balance").innerText = data.balance;

            } else {
                alert("كلمة المرور غير صحيحة ❌");
            }

        } else {
            alert("المستخدم غير موجود ❌");
        }
    });
}

function logout(){
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("dashboard").classList.add("hidden");
}

</script>

</body>
</html>
