<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Chanci-App | تسجيل الدخول</title>
<style>
body {margin:0;font-family:Arial;background:#0a0a0a;color:#fff;}
.container {max-width:400px;margin:auto;padding:20px;margin-top:80px;}
.box {background:#1c1c1c;padding:20px;border-radius:12px;text-align:center;}
input {width:100%;padding:12px;margin:10px 0;border:none;border-radius:8px;background:#2c2c2c;color:#fff;}
button {width:100%;padding:12px;background:gold;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}
h1 {color:gold;}
</style>
</head>
<body>

<div class="container">
  <div class="box">
    <h1>Chanci-App</h1>
    <input id="user" placeholder="اسم المستخدم">
    <input id="pass" type="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBsx...",
  authDomain: "chanci-app.firebaseapp.com",
  databaseURL: "https://chanci-app-default-rtdb.firebaseio.com",
  projectId: "chanci-app",
  storageBucket: "chanci-app.firebasestorage.app",
  messagingSenderId: "18416485348",
  appId: "1:18416485348:web:12176965505080897b3df1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function login(){
  const user = document.getElementById("user").value.trim();
  const pass = document.getElementById("pass").value.trim();

  // 🔥 دخول المدير
  if(user === "doktor" && pass === "123456"){
    localStorage.setItem("currentUser","doktor");
    window.location.href="admin.html";
    return;
  }

  // 🔥 دخول المستخدم العادي
  db.ref("users/" + user).get().then(snap=>{
    if(snap.exists()){
      const data = snap.val();

      if(data.password === pass){
        localStorage.setItem("currentUser", user);
        window.location.href = "dashboard.html";
      } else {
        alert("كلمة المرور غير صحيحة");
      }
    } else {
      alert("المستخدم غير موجود");
    }
  });
}
</script>

</body>
</html>
