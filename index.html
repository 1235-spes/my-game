<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanci-App كامل</title>
<style>
body { margin:0; font-family:Arial; background:#0a0a0a; color:#fff; }
.container { max-width:480px; margin:auto; padding:20px; }
.logo { text-align:center; font-size:36px; font-weight:bold; color: gold; margin-bottom: 10px; }
.login-box, .dashboard, .admin-box { background:#1c1c1c; border-radius:12px; padding:20px; margin-bottom:20px; box-shadow:0 0 20px rgba(255,215,0,0.5); }
.login-box input, .admin-box input { width:100%; padding:12px; margin:10px 0; border-radius:8px; border:none; background:#2c2c2c; color:#fff; }
.login-box button, .admin-box button { width:100%; padding:12px; background: gold; color:#000; font-weight:bold; border:none; border-radius:8px; cursor:pointer; margin-top:10px; }
.menu, .dashboard .menu { display:flex; justify-content:space-between; margin:20px 0; }
.menu div, .dashboard .menu div { text-align:center; flex:1; margin:0 5px; background:#1c1c1c; padding:15px; border-radius:12px; cursor:pointer; box-shadow:0 0 10px rgba(255,215,0,0.4); }
.menu div img, .dashboard .menu div img { width:40px; margin-bottom:8px; }
.menu div span, .dashboard .menu div span { display:block; font-size:14px; font-weight:bold; color: gold; }
.balance-box { display:flex; justify-content:space-between; background:#1c1c1c; padding:20px; border-radius:12px; margin-bottom:20px; box-shadow:0 0 20px rgba(255,215,0,0.3); }
.balance-box div { text-align:center; }
.games-section { display:flex; overflow-x:auto; gap:15px; }
.game-card { min-width:120px; background:#1c1c1c; border-radius:12px; padding:10px; text-align:center; box-shadow:0 0 10px rgba(255,215,0,0.3); }
.game-card img { width:60px; margin-bottom:5px; }
.game-card button { width:100%; padding:6px; background:gold; border:none; border-radius:6px; cursor:pointer; color:#000; font-weight:bold; }
.logout-btn { background:red; color:#fff; padding:8px 12px; border:none; border-radius:8px; cursor:pointer; margin-top:10px; }
</style>
</head>
<body>
<div class="container">

<!-- صفحة تسجيل الدخول -->
<div class="login-box" id="loginBox">
  <div class="logo">Chanci-App</div>
  <h2>مرحباً بك</h2>
  <input type="text" id="username" placeholder="اسم المستخدم">
  <input type="password" id="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
</div>

<!-- لوحة المستخدم -->
<div class="dashboard" id="dashboard" style="display:none;">
  <div class="logo">Chanci-App</div>
  <div id="welcome"></div>
  <div class="balance-box">
    <div>
      <h3>الرصيد</h3>
      <p id="balance">0</p>
    </div>
    <div>
      <h3>الأرباح</h3>
      <p id="earnings">0</p>
    </div>
  </div>
  <div class="menu">
    <div><img src="https://img.icons8.com/ios-filled/50/FFD700/game-controller.png"/><span>الألعاب</span></div>
    <div><img src="https://img.icons8.com/ios-filled/50/00FF00/discount.png"/><span>القسائم</span></div>
    <div><img src="https://img.icons8.com/ios-filled/50/FFD700/roulette.png"/><span>السحوبات</span></div>
  </div>
  <h3>الألعاب المميزة</h3>
  <div class="games-section">
    <div class="game-card"><img src="https://img.icons8.com/ios-filled/50/FFD700/roulette.png"/><p>Fortune Wheel</p><button>العب الآن</button></div>
    <div class="game-card"><img src="https://img.icons8.com/ios-filled/50/FFD700/slot-machine.png"/><p>Lucky Slots</p><button>العب الآن</button></div>
  </div>
  <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
</div>

<!-- لوحة تحكم المدير -->
<div class="admin-box" id="adminBox" style="display:none;">
  <div class="logo">لوحة التحكم - doktor</div>
  <h3>إنشاء مستخدم جديد</h3>
  <input type="text" id="newUser" placeholder="اسم المستخدم">
  <input type="password" id="newPass" placeholder="كلمة المرور">
  <input type="number" id="newBalance" placeholder="الرصيد الابتدائي" value="0">
  <button onclick="createUser()">إنشاء المستخدم</button>
  <div class="user-list" id="userList"></div>
  <button class="logout-btn" onclick="adminLogout()">تسجيل خروج</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = { databaseURL: "https://chanci-app-default-rtdb.firebaseio.com/" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// تسجيل الدخول
function login(){
  const user = document.getElementById('username').value;
  const pass = document.getElementById('password').value;

  if(user === "doktor" && pass === "123456"){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminBox').style.display='block';
    loadUsers();
    return;
  }

  db.ref('users/'+user).get().then(snapshot=>{
    if(snapshot.exists()){
      if(snapshot.val().password === pass){
        localStorage.setItem('currentUser', user);
        document.getElementById('loginBox').style.display='none';
        document.getElementById('dashboard').style.display='block';
        document.getElementById('welcome').innerHTML="<h2>مرحباً "+user+"</h2>";
        document.getElementById('balance').innerText=snapshot.val().balance || 0;
        document.getElementById('earnings').innerText=snapshot.val().earnings || 0;
      } else { alert("كلمة المرور خاطئة"); }
    } else { alert("المستخدم غير موجود"); }
  });
}

// لوحة التحكم
function createUser(){
  const username = document.getElementById('newUser').value;
  const password = document.getElementById('newPass').value;
  const balance = Number(document.getElementById('newBalance').value);

  if(username && password){
    db.ref('users/'+username).set({ password:password, balance:balance, earnings:0 });
    alert("تم إنشاء المستخدم "+username);
    loadUsers();
  }
}

function loadUsers(){
  db.ref('users').get().then(snapshot=>{
    const userList = document.getElementById('userList');
    userList.innerHTML = "";
    if(snapshot.exists()){
      Object.keys(snapshot.val()).forEach(u=>{
        const div = document.createElement('div');
        div.className="user-card";
        div.style.background="#2c2c2c"; div.style.color="#fff"; div.style.padding="10px"; div.style.margin="5px 0"; div.style.borderRadius="8px";
        div.innerHTML = "<strong>"+u+"</strong> | الرصيد: "+snapshot.val()[u].balance+" | الأرباح: "+snapshot.val()[u].earnings;
        userList.appendChild(div);
      });
    }
  });
}

// تسجيل الخروج
function logout(){ localStorage.removeItem('currentUser'); location.reload(); }
function adminLogout(){ location.reload(); }
</script>
</body>
</html>
