<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanci-App | تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    background: #0e0e0e url('https://i.ibb.co/0y6x0z1/bg-dark.png') no-repeat center center/cover;
    color: #fff;
  }
  .login-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    text-align: center;
  }
  .login-container h1 {
    font-size: 48px;
    margin-bottom: 20px;
    color: gold;
    text-shadow: 0 0 10px #ffd700;
  }
  .login-box {
    background: rgba(20,20,20,0.85);
    padding: 40px;
    border-radius: 15px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 0 30px rgba(255,215,0,0.5);
  }
  .login-box input {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 16px;
  }
  .login-box button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    background: gold;
    border: none;
    border-radius: 10px;
    color: #000;
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
  }
  .login-box button:hover {
    background: #ffea00;
    box-shadow: 0 0 20px #ffd700;
  }
  .features {
    display: flex;
    justify-content: space-around;
    margin-top: 30px;
  }
  .feature-card {
    text-align: center;
    color: #fff;
  }
  .feature-card img {
    width: 60px;
    margin-bottom: 10px;
  }
  .feature-card span {
    display: block;
    margin-top: 5px;
  }
</style>
</head>
<body>
<div class="login-container">
  <h1>Chanci-App</h1>
  <div class="login-box">
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="login()">تسجيل الدخول</button>
    <p id="message" style="color: red; margin-top: 10px;"></p>
  </div>
  <div class="features">
    <div class="feature-card">
      <img src="https://i.ibb.co/k2xjqFY/wallet.png" alt="الرصيد">
      <span>الرصيد</span>
    </div>
    <div class="feature-card">
      <img src="https://i.ibb.co/2yLqH9F/gamepad.png" alt="الألعاب">
      <span>الألعاب</span>
    </div>
    <div class="feature-card">
      <img src="https://i.ibb.co/NY0bXy2/coupon.png" alt="القسائم">
      <span>القسائم</span>
    </div>
    <div class="feature-card">
      <img src="https://i.ibb.co/bW6xGk7/wheel.png" alt="السحوبات">
      <span>السحوبات</span>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  // إعداد Firebase (استبدل بالبيانات الخاصة بك)
  const firebaseConfig = {
    apiKey: "API_KEY_HERE",
    authDomain: "PROJECT_ID.firebaseapp.com",
    databaseURL: "https://PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "PROJECT_ID",
    storageBucket: "PROJECT_ID.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId: "APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const messageEl = document.getElementById('message');

    if(!username || !password) {
      messageEl.innerText = "يرجى إدخال اسم المستخدم وكلمة المرور.";
      return;
    }

    database.ref('users/' + username).get().then((snapshot) => {
      if(snapshot.exists()) {
        const userData = snapshot.val();
        if(userData.password === password) {
          messageEl.style.color = 'lime';
          messageEl.innerText = "تم تسجيل الدخول بنجاح!";
          localStorage.setItem('currentUser', username);
          setTimeout(()=> { window.location.href = 'dashboard.html'; }, 1000);
        } else {
          messageEl.style.color = 'red';
          messageEl.innerText = "كلمة المرور خاطئة.";
        }
      } else {
        messageEl.style.color = 'red';
        messageEl.innerText = "اسم المستخدم غير موجود.";
      }
    }).catch((err) => {
      messageEl.style.color = 'red';
      messageEl.innerText = "حدث خطأ، حاول مرة أخرى.";
      console.error(err);
    });
  }
</script>
</body>
</html>
