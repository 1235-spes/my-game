<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanci</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#f5f5f5;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

button{
    padding:12px 20px;
    margin:10px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

.open{
    background:#4CAF50;
    color:white;
}

.coupon{
    background:#2196F3;
    color:white;
}

#message{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🎮 لعبة فتح الصندوق</h1>

<h2>النقاط: <span id="points">0</span></h2>

<button class="open" onclick="openBox()">
🎁 افتح الصندوق
</button>

<div id="message"></div>

<hr>

<h2>🎟️ شراء القسائم</h2>

<button class="coupon" onclick="buyCoupon(1)">
قسيمة 1$
</button>

<button class="coupon" onclick="buyCoupon(5)">
قسيمة 5$
</button>

<button class="coupon" onclick="buyCoupon(10)">
قسيمة 10$
</button>

<p>
عدد القسائم: <span id="coupons">0</span>
</p>

</div>

<script>

let points = 0;
let coupons = 0;

function openBox(){

let reward = Math.floor(Math.random() * 100) + 1;

points += reward;

document.getElementById("points").innerText = points;

document.getElementById("message").innerText =
"🎉 ربحت " + reward + " نقطة";
}

function buyCoupon(price){

coupons++;

document.getElementById("coupons").innerText = coupons;

alert("تم شراء قسيمة بقيمة " + price + "$");
}

</script>

</body>
</html>
