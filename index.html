<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanci-app</title><style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    background:url('https://images.unsplash.com/photo-1621761191319-c6fb62004040?q=80&w=1200') center/cover;
    min-height:100vh;
}

.overlay{
    background:rgba(0,0,0,0.65);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    color:white;
}

.logo{
    font-size:36px;
    font-weight:bold;
    margin-top:20px;
}

.balance{
    background:rgba(255,255,255,0.15);
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

.balance h2{
    margin:0;
}

.balance span{
    font-size:32px;
    color:gold;
}

.card{
    background:rgba(255,255,255,0.15);
    padding:15px;
    border-radius:15px;
    margin-top:15px;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}
</style></head><body><div class="overlay"><div class="container"><div class="logo">
💰 Chanci-app
</div><div class="balance">
<h2>رصيدك</h2>
<span id="balance">0</span>
</div><div class="card">
<h3>🎮 الألعاب</h3>
<p>ألعاب بالنقاط التي يمنحها المدير.</p>
<button>دخول الألعاب</button>
</div><div class="card">
<h3>🎟️ القسائم</h3>
<p>شراء وإدارة القسائم.</p>
<button>القسائم</button>
</div><div class="card">
<h3>🏆 السحوبات</h3>
<p>عرض السحوبات والجوائز.</p>
<button>السحوبات</button>
</div></div></div><script>
document.getElementById("balance").innerText = "3000";
</script></body>
</html>
