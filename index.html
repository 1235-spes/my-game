<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Chanci - Login</title>
<style>
body{
margin:0;
font-family:Arial;
background:#0c0c0c;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#fff;
}

.box{
width:90%;
max-width:400px;
background:#1a1a1a;
padding:25px;
border-radius:15px;
border:1px solid #333;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
background:#2a2a2a;
color:#fff;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#FFD700;
font-weight:bold;
cursor:pointer;
}
.status{
text-align:center;
margin-top:10px;
color:#ffcc00;
}
</style>
</head>
<body>

<div class="box">
<h2 style="color:#FFD700;text-align:center;">Chanci Login</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="register()">Register</button>

<div class="status" id="status"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBsx_iEGWKEDlEQe6B2rz4yKAhGdz1uas",
  authDomain: "chanci-app.firebaseapp.com",
  databaseURL: "https://chanci-app-default-rtdb.firebaseio.com",
  projectId: "chanci-app",
  storageBucket: "chanci-app.firebasestorage.app",
  messagingSenderId: "18416485348",
  appId: "1:18416485348:web:12176965505080897b3df1"
};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.database();

const status = document.getElementById("status");

// تسجيل دخول
function login(){
let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

status.innerHTML = "Loading...";

auth.signInWithEmailAndPassword(email,password)
.then(user=>{
localStorage.setItem("uid", user.user.uid);

if(email === "admin@gmail.com"){
window.location.href="admin.html";
}else{
window.location.href="dashboard.html";
}

})
.catch(err=>{
status.innerHTML = err.message;
});
}

// تسجيل حساب
function register(){
let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

status.innerHTML = "Creating account...";

auth.createUserWithEmailAndPassword(email,password)
.then(user=>{
let uid = user.user.uid;

db.ref("users/"+uid).set({
balance:0,
earnings:0,
points:0,
wins:0
});

localStorage.setItem("uid",uid);

window.location.href="dashboard.html";
})
.catch(err=>{
status.innerHTML = err.message;
});
}
</script>

</body>
</html>
