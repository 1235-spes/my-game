<!-- الجزء 1: الهيكل العام والصفحة الرئيسية مع Login -->
<div class="login-box" id="loginBox">
  <div class="logo">CH<span style="color:#ffd700;">ANCI</span>-APP</div>
  <h2 style="color:gold;">مرحباً بك</h2>
  <input type="text" id="username" placeholder="اسم المستخدم">
  <input type="password" id="password" placeholder="كلمة المرور">
  <button onclick="login()" style="background: linear-gradient(90deg, #ffd700, #ffcc00); color:#000; font-weight:bold;">دخول</button>
</div>

<div class="dashboard hidden" id="dashboard">
  <div class="header" style="display:flex; justify-content:space-between; align-items:center; padding:10px; background:#1c1c1c; border-radius:12px; box-shadow:0 0 20px rgba(255,215,0,0.5);">
    <div class="logo" style="color:gold; font-size:28px;">CH<span style="color:#ffd700;">ANCI</span>-APP</div>
    <div class="user-avatar" style="width:50px; height:50px; border-radius:50%; background:gold;"></div>
  </div>
  <div id="welcome" style="margin:15px 0; font-size:20px; font-weight:bold; color:gold;"></div>

  <!-- رصيد المستخدم -->
  <div class="balance-box" style="display:flex; justify-content:space-between; gap:10px; margin-bottom:20px;">
    <div style="flex:1; background:#1c1c1c; padding:15px; border-radius:12px; box-shadow:0 0 15px rgba(255,215,0,0.4); text-align:center;">
      <h3>الرصيد</h3>
      <p id="balance" style="font-size:24px; color:#ffd700;">0</p>
    </div>
    <div style="flex:1; background:#1c1c1c; padding:15px; border-radius:12px; box-shadow:0 0 15px rgba(255,215,0,0.4); text-align:center;">
      <h3>الأرباح</h3>
      <p id="earnings" style="font-size:24px; color:#ffd700;">0</p>
    </div>
  </div>
</div>
