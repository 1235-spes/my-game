<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanci-App | تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(180deg, #0a0a0a 0%, #1e1e1e 100%);
    color: #fff;
  }
  .login-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    text-align: center;
  }
  .login-container h1 {
    font-size: 48px;
    color: gold;
    text-shadow: 0 0 15px #ffd700;
    margin-bottom: 30px;
  }
  .login-box {
    background: rgba(30,30,30,0.95);
    padding: 50px 40px;
    border-radius: 20px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 0 40px rgba(255,215,0,0.4);
  }
  .login-box input {
    width: 100%;
    padding: 18px;
    margin: 12px 0;
    border-radius: 12px;
    border: none;
    outline: none;
    font-size: 17px;
    background: #222;
    color: #fff;
  }
  .login-box button {
    width: 100%;
    padding: 18px;
    margin-top: 25px;
    background: gold;
    border: none;
    border-radius: 12px;
    color: #000;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
  }
  .login-box button:hover {
    background: #ffd700;
  }
  .features {
    display: flex;
    justify-content: space-around;
    margin-top: 40px;
    flex-wrap: wrap;
  }
  .feature-card {
    text-align: center;
    color: #fff;
    margin: 10px;
  }
  .feature-card img {
    width: 65px;
    margin-bottom: 10px;
  }
  .feature-card span {
    display: block;
    font-weight: bold;
  }
  @media (max-width: 600px) {
    .login-box { padding: 40px 25px; }
    .login-box input, .login-box button { font-size: 16px; padding: 16px; }
    .feature-card img { width: 50px; }
  }
</style>
</head>
<body>
<div class="login-container">
  <h1>Chanci-App</h1>
  <div class="login-box">
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="login()">تسجيل الدخول</button>
    <p id="message" style="color: red; margin-top: 12px;"></p>
  </div>
  <div class="features">
    <div class="feature-card">
      <img src="https://i.ibb.co/k2xjqFY/wallet.png" alt="الرصيد">
      <span>الرصيد</span>
    </div>
    <div class="feature-card">
      <img src="https://i.ibb.co/2yLqH9F/gamepad.png" alt="الألعاب">
      <span>الألعاب</span>
    </div>
    <div class="feature-card">
      <img src="https://i.ibb.co/NY0bXy2/coupon.png" alt="القسائم">
      <span>القسائم</span>
    </div>
    <div class="feature-card">
      <img src="https://i.ibb.co/bW6xGk7/wheel.png" alt="السحوبات">
      <span>السحوبات</span>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBsx_iEGWKEDlEQe6B2rz4yqKAhGdz1uas",
  authDomain: "chanci-app.firebaseapp.com",
  databaseURL: "https://chanci-app-default-rtdb.firebaseio.com",
  projectId: "chanci-app",
  storageBucket: "chanci-app.firebasestorage.app",
  messagingSenderId: "18416485348",
  appId: "1:18416485348:web:12176965505080897b3df1",
  measurementId: "G-6YXX3SS61D"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const messageEl = document.getElementById('message');

  if(!username || !password) {
    messageEl.innerText = "يرجى إدخال اسم المستخدم وكلمة المرور.";
    return;
  }

  database.ref('users/' + username).get().then((snapshot) => {
    if(snapshot.exists()) {
      const userData = snapshot.val();
      if(String(userData.password) === String(password)) {
        messageEl.style.color = 'lime';
        messageEl.innerText = "تم تسجيل الدخول بنجاح!";
        localStorage.setItem('currentUser', username);
        setTimeout(()=> { window.location.href = 'dashboard.html'; }, 1000);
      } else {
        messageEl.style.color = 'red';
        messageEl.innerText = "كلمة المرور خاطئة.";
      }
    } else {
      messageEl.style.color = 'red';
      messageEl.innerText = "اسم المستخدم غير موجود.";
    }
  }).catch((err) => {
    messageEl.style.color = 'red';
    messageEl.innerText = "حدث خطأ، حاول مرة أخرى.";
    console.error(err);
  });
}
</script>
</body>
</html>
