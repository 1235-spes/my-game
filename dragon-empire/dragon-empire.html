<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Empire</title>
  <link rel="stylesheet" href="dragon-empire.css">
</head>
<body>

  <h1>🔥 Dragon Empire 🐉</h1>

  <div class="game">

    <div class="reels">
      <div class="reel" id="r1"></div>
      <div class="reel" id="r2"></div>
      <div class="reel" id="r3"></div>
      <div class="reel" id="r4"></div>
      <div class="reel" id="r5"></div>
    </div>

    <button id="spin">🔥 SPIN</button>

    <div class="info">
      💰 Balance: <span id="balance">0</span>
    </div>

  </div>

  <script src="dragon-empire.js"></script>
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "XXXX",
    appId: "XXXX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.db = db;
  window.fbRef = ref;
  window.fbGet = get;
  window.fbSet = set;
  window.fbUpdate = update;
</script>
</body>
</html>
