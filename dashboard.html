<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanci-App | Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
  body {
    margin:0;
    font-family:'Cairo',sans-serif;
    background:#0e0e0e;
    color:#fff;
    overflow-x:hidden;
  }

  /* زر ☰ */
  .menu-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    font-size: 28px;
    cursor: pointer;
    z-index: 2000;
    background:#111;
    padding:8px 12px;
    border-radius:8px;
  }

  /* Overlay */
  .overlay {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    opacity:0;
    visibility:hidden;
    transition:0.3s;
    z-index:1500;
  }

  .overlay.active {
    opacity:1;
    visibility:visible;
  }

  /* Sidebar */
  .sidebar {
    position: fixed;
    top:0;
    right:-260px;
    width:250px;
    height:100%;
    background:#111;
    display:flex;
    flex-direction:column;
    padding:20px;
    transition:0.3s;
    z-index:1600;
  }

  .sidebar.active {
    right:0;
  }

  .sidebar h2 {
    color:gold;
    text-align:center;
    margin-bottom:30px;
  }

  .sidebar a {
    text-decoration:none;
    color:#ccc;
    margin:10px 0;
    padding:12px;
    border-radius:8px;
    transition:0.3s;
    cursor:pointer;
  }

  .sidebar a:hover {
    background:#222;
    color:gold;
  }

  /* MAIN */
  .container {
    display:flex;
    min-height:100vh;
  }

  .main {
    flex:1;
    position: relative;
    padding:30px;
  }

  /* PAGES (ANIMATION SYSTEM) */
  .page {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    min-height:100%;
    padding:30px;
    box-sizing:border-box;

    opacity:0;
    transform:translateX(50px);
    transition:0.4s ease;
    pointer-events:none;
  }

  .page.active {
    opacity:1;
    transform:translateX(0);
    pointer-events:auto;
  }

  /* UI */
  .user-info {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
  }

  .logout button {
    background:gold;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
  }

  .stats {
    display:flex;
    gap:20px;
    margin-bottom:30px;
  }

  .card {
    background:#111;
    padding:20px;
    border-radius:15px;
    flex:1;
    text-align:center;
  }

  .card h3 {
    margin:0;
    font-size:24px;
    color:gold;
  }

  .card p {
    color:#aaa;
  }

</style>
</head>

<body>

<!-- زر القائمة -->
<div class="menu-btn" onclick="toggleSidebar()">☰</div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <h2>Chanci-App</h2>
  <a onclick="showPage('homePage')">الرئيسية</a>
  <a onclick="showPage('walletPage')">المحفظة</a>
  <a onclick="showPage('gamesPage')">الألعاب</a>
  <a onclick="showPage('settingsPage')">الإعدادات</a>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="container">
  <div class="main">

    <!-- HOME -->
    <div class="page active" id="homePage">
      <div class="user-info">
        <div>مرحباً بك، <span id="usernameDisplay">Player123</span></div>
        <div class="logout"><button onclick="logout()">تسجيل الخروج</button></div>
      </div>

      <div class="stats">
        <div class="card"><h3 id="balance">0</h3><p>الرصيد</p></div>
        <div class="card"><h3 id="points">0</h3><p>النقاط</p></div>
        <div class="card"><h3 id="wins">0</h3><p>الأرباح</p></div>
      </div>
    </div>

    <!-- WALLET -->
    <div class="page" id="walletPage">
      <h2>💰 المحفظة</h2>
      <p>هنا تفاصيل الرصيد والمعاملات.</p>
    </div>

    <!-- GAMES -->
    <div class="page" id="gamesPage">
      <h2>🎮 الألعاب</h2>
      <p>قسم الألعاب.</p>
    </div>

    <!-- SETTINGS -->
    <div class="page" id="settingsPage">
      <h2>⚙️ الإعدادات</h2>
      <p>إعدادات الحساب.</p>
    </div>

  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "API_KEY_HERE",
  authDomain: "PROJECT_ID.firebaseapp.com",
  databaseURL: "https://PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "PROJECT_ID",
  storageBucket: "PROJECT_ID.appspot.com",
  messagingSenderId: "SENDER_ID",
  appId: "APP_ID"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const currentUser = localStorage.getItem('currentUser');
document.getElementById('usernameDisplay').innerText = currentUser;

/* SIDEBAR */
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("active");
  document.getElementById("overlay").classList.toggle("active");
}

function closeSidebar(){
  document.getElementById("sidebar").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closeSidebar();
});

/* PAGE NAVIGATION (ANIMATED) */
function showPage(pageId){
  const pages = document.querySelectorAll('.page');

  pages.forEach(p=>{
    if(p.id === pageId){
      p.classList.add('active');
    } else {
      p.classList.remove('active');
    }
  });

  closeSidebar();
}

/* FIREBASE */
database.ref('users/' + currentUser).get().then(snapshot => {
  if(snapshot.exists()){
    const data = snapshot.val();
    document.getElementById('balance').innerText = data.balance;
    document.getElementById('points').innerText = data.points;
    document.getElementById('wins').innerText = data.wins;
  }
});

/* LOGOUT */
function logout(){
  localStorage.removeItem('currentUser');
  window.location.href='index.html';
}
</script>

</body>
</html>
