<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Chanci-App | المستخدم</title>
<style>
body {margin:0;font-family:Arial;background:#0a0a0a;color:#fff;}
.container {max-width:500px;margin:auto;padding:20px;}
.box {background:#1c1c1c;padding:15px;border-radius:12px;margin-bottom:15px;}
button {width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;background:gold;font-weight:bold;cursor:pointer;}
.menu {display:flex;gap:10px;margin-top:10px;}
.menu button {flex:1;}
h2 {color:gold;text-align:center;}
.small {font-size:14px;color:#aaa;}
#modal {display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);justify-content:center;align-items:center;}
#modal div {background:#1c1c1c;padding:20px;border-radius:12px;text-align:center;color:gold;}
</style>
</head>
<body>

<div class="container">

<h2>🎮 لوحة المستخدم</h2>

<div class="box">
<p>💰 الرصيد: <span id="balance">0</span></p>
<p class="small">🔄 الإنفاق: <span id="spent">0</span> / 100000</p>
</div>

<div class="box">
<h3>🎁 الصندوق</h3>
<p class="small">أنفق 100000 رصيد لفتح فرصة</p>
<button onclick="openBox()">فتح الصندوق</button>
</div>

<div class="box">
<h3>💸 تجربة إنفاق (اختبار)</h3>
<button onclick="spend(10000)">إنفاق 10,000</button>
<button onclick="spend(50000)">إنفاق 50,000</button>
</div>

<button onclick="logout()">تسجيل خروج</button>

</div>

<!-- Modal -->
<div id="modal"><div><p id="msg"></p><button onclick="closeModal()">إغلاق</button></div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBsx_iEGWKEDlEQe6B2rz4yKAhGdz1uas",
  authDomain: "chanci-app.firebaseapp.com",
  databaseURL: "https://chanci-app-default-rtdb.firebaseio.com",
  projectId: "chanci-app",
  storageBucket: "chanci-app.firebasestorage.app",
  messagingSenderId: "18416485348",
  appId: "1:18416485348:web:12176965505080897b3df1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const currentUser = localStorage.getItem("currentUser");
if(!currentUser || currentUser === "doktor"){
  window.location.href = "index.html";
}

let userData = {};

// تحميل البيانات
db.ref("users/"+currentUser).on("value", snap=>{
  userData = snap.val();

  document.getElementById("balance").innerText = userData.balance || 0;
  document.getElementById("spent").innerText = userData.spentSinceLastBox || 0;
});

// 💸 إنفاق
function spend(amount){
  db.ref("users/"+currentUser).once("value").then(snap=>{
    const data = snap.val();
    let balance = data.balance || 0;
    let spent = data.spentSinceLastBox || 0;
    let boxAvailable = data.boxAvailable || false;

    if(balance < amount){
      show("❌ رصيد غير كافي");
      return;
    }

    balance -= amount;
    spent += amount;

    // عند الوصول للحد
    if(spent >= 100000){
      boxAvailable = true;
      spent = 0;
    }

    db.ref("users/"+currentUser).update({
      balance: balance,
      spentSinceLastBox: spent,
      boxAvailable: boxAvailable
    });

    show("💸 تم خصم " + amount);
  });
}

// 🎁 فتح الصندوق
function openBox(){
  db.ref("users/"+currentUser).once("value").then(snap=>{
    const data = snap.val();

    if(!data.boxAvailable){
      show("❌ لا توجد فرصة حالياً. أنفق 100,000 أولاً");
      return;
    }

    const reward = Math.floor(Math.random()*51);
    const newBalance = (data.balance || 0) + reward;

    db.ref("users/"+currentUser).update({
      balance: newBalance,
      boxAvailable: false
    });

    show("🎉 ربحت " + reward + " رصيد!");
  });
}

// 🔔 رسالة
function show(msg){
  document.getElementById("msg").innerText = msg;
  document.getElementById("modal").style.display = "flex";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

// خروج
function logout(){
  localStorage.removeItem("currentUser");
  window.location.href = "index.html";
}
</script>

</body>
</html>
