<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanci Dashboard</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;padding:0;}
.header{background:#222;padding:15px;text-align:center;font-size:24px;font-weight:bold;color:#FFD700;}
.container{padding:20px;}
.balance-card{background:#1a1a1a;padding:20px;border-radius:15px;margin-bottom:20px;text-align:center;}
.balance-card h2{margin-bottom:10px;color:#FFD700;}
button{padding:12px 20px;border:none;border-radius:10px;background:#FFD700;color:#000;font-weight:bold;cursor:pointer;transition:.3s;}
button:hover{transform:translateY(-2px);}
</style>
</head>
<body>

<div class="header">لوحة المستخدم</div>
<div class="container">
  <div class="balance-card">
    <h2>الرصيد الحالي</h2>
    <div id="balance">0</div>
    <button onclick="addPoints(100)">إضافة 100 نقطة</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBsx_iEGWKEDlEQe6B2rz4yqKAhGdz1uas",
  authDomain: "chanci-app.firebaseapp.com",
  databaseURL: "https://chanci-app-default-rtdb.firebaseio.com",
  projectId: "chanci-app",
  storageBucket: "chanci-app.firebasestorage.app",
  messagingSenderId: "18416485348",
  appId: "1:18416485348:web:918a393569acb47a7b3df1",
  measurementId: "G-S8ZCNJBFQ8"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const currentUser = localStorage.getItem("currentUser");
if(!currentUser) window.location.href = "index.html";

function addPoints(amount){
  const balanceRef = db.ref("users/" + currentUser + "/balance");
  balanceRef.get().then(snapshot=>{
    let currentBalance = snapshot.exists() ? Number(snapshot.val()) : 0;
    balanceRef.set(currentBalance + amount);
    document.getElementById("balance").innerText = currentBalance + amount;
  });
}

// عرض الرصيد عند التحميل
db.ref("users/" + currentUser + "/balance").get().then(snapshot=>{
  document.getElementById("balance").innerText = snapshot.exists() ? snapshot.val() : 0;
});
</script>
</body>
</html>
