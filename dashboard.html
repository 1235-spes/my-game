<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanci-App | لوحة المستخدم</title>
<style>
/* ==========================
  Reset & Fonts
========================== */
body, html { margin:0; padding:0; font-family: 'Cairo', sans-serif; background:#0a0a0a; color:#fff; }
h2,h3,p { margin:0; padding:0; }

/* ==========================
  Sidebar
========================== */
.sidebar {
  position: fixed;
  top:0; right:-250px;
  width:250px;
  height:100%;
  background:#111;
  padding:20px;
  box-shadow: -2px 0 10px rgba(255,215,0,0.2);
  transition: right 0.3s ease;
  z-index:1000;
}
.sidebar.active { right:0; }
.sidebar h2 { text-align:center; color:gold; margin-bottom:30px; }
.sidebar a {
  display:block;
  padding:12px 15px;
  margin:8px 0;
  color:#ccc;
  text-decoration:none;
  border-radius:8px;
  transition:0.3s;
}
.sidebar a:hover { background:#222; color:gold; }

/* ==========================
  Header + Hamburger
========================== */
.header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 20px;
  background:#111;
  box-shadow:0 2px 5px rgba(255,215,0,0.1);
}
.hamburger {
  font-size:28px;
  cursor:pointer;
  color:gold;
  user-select:none;
}
.header h2 { color:gold; }

/* ==========================
  Main Content
========================== */
.main { margin-right:0; transition: margin-right 0.3s ease; padding:20px; }
.main.shift { margin-right:250px; }

.cards { display:flex; gap:20px; flex-wrap:wrap; margin-top:20px; }
.card {
  background:#1c1c1c;
  flex:1 1 200px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(255,215,0,0.2);
  text-align:center;
  transition: transform 0.2s;
}
.card:hover { transform: translateY(-5px); }
.card h3 { font-size:24px; color:gold; margin-bottom:10px; }
.card p { color:#ccc; font-size:14px; }

/* ==========================
  Games Section
========================== */
.games-section {
  display:flex;
  overflow-x:auto;
  gap:15px;
  margin-top:30px;
}
.game-card {
  min-width:120px;
  background:#1c1c1c;
  border-radius:12px;
  padding:10px;
  text-align:center;
  box-shadow:0 0 10px rgba(255,215,0,0.3);
}
.game-card img { width:60px; margin-bottom:5px; }
.game-card button {
  width:100%;
  padding:6px;
  background:gold;
  border:none;
  border-radius:6px;
  cursor:pointer;
  color:#000;
  font-weight:bold;
}
.logout-btn { background:red; color:#fff; padding:8px 12px; border:none; border-radius:8px; cursor:pointer; margin-top:20px; width:100%; }

/* ==========================
  Responsive
========================== */
@media(max-width:768px){
  .cards { flex-direction:column; }
  .main.shift { margin-right:0; }
}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <h2>Chanci-App</h2>
  <a href="#">الرئيسية</a>
  <a href="#">المحفظة</a>
  <a href="#">الإيداع</a>
  <a href="#">السحب</a>
  <a href="#">الألعاب</a>
  <a href="#">القسائم</a>
  <a href="#">السحوبات</a>
  <a href="#">التاريخ</a>
  <a href="#">التوثيق</a>
  <a href="#">الإعدادات</a>
  <a href="#">دعم العملاء</a>
</div>

<!-- Header -->
<div class="header">
  <h2>لوحة المستخدم</h2>
  <div class="hamburger" id="hamburger">☰</div>
</div>

<!-- Main Content -->
<div class="main" id="main">
  <h2 id="welcome">مرحباً بك، User</h2>

  <div class="cards">
    <div class="card">
      <h3 id="balance">0</h3>
      <p>الرصيد</p>
    </div>
    <div class="card">
      <h3 id="earnings">0</h3>
      <p>الأرباح</p>
    </div>
    <div class="card">
      <h3 id="points">0</h3>
      <p>النقاط</p>
    </div>
  </div>

  <h3>الألعاب المميزة</h3>
  <div class="games-section">
    <div class="game-card">
      <img src="https://img.icons8.com/ios-filled/50/FFD700/roulette.png"/>
      <p>Fortune Wheel</p>
      <button>العب الآن</button>
    </div>
    <div class="game-card">
      <img src="https://img.icons8.com/ios-filled/50/FFD700/slot-machine.png"/>
      <p>Lucky Slots</p>
      <button>العب الآن</button>
    </div>
    <div class="game-card">
      <img src="https://img.icons8.com/ios-filled/50/FFD700/coin.png"/>
      <p>Coin Flip</p>
      <button>العب الآن</button>
    </div>
    <div class="game-card">
      <img src="https://img.icons8.com/ios-filled/50/FFD700/treasure-map.png"/>
      <p>Treasure Hunt</p>
      <button>العب الآن</button>
    </div>
  </div>

  <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ==========================
// Firebase Config
// ضع القيم الخاصة بمشروعك هنا
// ==========================
const firebaseConfig = {
  apiKey: "API_KEY_HERE",
  authDomain: "PROJECT_ID.firebaseapp.com",
  databaseURL: "https://PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "PROJECT_ID",
  storageBucket: "PROJECT_ID.appspot.com",
  messagingSenderId: "SENDER_ID",
  appId: "APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ==========================
// Sidebar Toggle
// ==========================
const hamburger = document.getElementById('hamburger');
const sidebar = document.getElementById('sidebar');
const main = document.getElementById('main');

hamburger.addEventListener('click',()=>{
  sidebar.classList.toggle('active');
  main.classList.toggle('shift');
});

// ==========================
// User Info
// ==========================
const currentUser = localStorage.getItem('currentUser') || 'User';
document.getElementById('welcome').innerText = "مرحباً بك، " + currentUser;

// ==========================
// Display Firebase Data (رصيد، أرباح، نقاط)
// ==========================
db.ref('users/' + currentUser).get().then(snapshot=>{
  if(snapshot.exists()){
    const data = snapshot.val();
    document.getElementById('balance').innerText = data.balance || 0;
    document.getElementById('earnings').innerText = data.earnings || 0;
    document.getElementById('points').innerText = data.points || 0;
  }
});

// ==========================
// Logout
// ==========================
function logout(){
  localStorage.removeItem('currentUser');
  window.location.href='index.html';
}
</script>
</body>
</html>
