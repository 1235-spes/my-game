<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<style>
body{
margin:0;
font-family:Arial;
background:#0c0c0c;
color:#fff;
}

.header{
padding:15px;
background:#141414;
display:flex;
justify-content:space-between;
}

.card{
background:#1a1a1a;
margin:15px;
padding:15px;
border-radius:12px;
border:1px solid #333;
}

h2{color:#FFD700;}
</style>
</head>
<body>

<div class="header">
<h2>Dashboard</h2>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>Balance</h3>
<h1 id="balance">0</h1>
</div>

<div class="card">
<h3>Earnings</h3>
<h1 id="earnings">0</h1>
</div>

<div class="card">
<h3>Points</h3>
<h1 id="points">0</h1>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBsx_iEGWKEDlEQe6B2rz4yKAhGdz1uas",
  authDomain: "chanci-app.firebaseapp.com",
  databaseURL: "https://chanci-app-default-rtdb.firebaseio.com",
  projectId: "chanci-app",
  storageBucket: "chanci-app.firebasestorage.app",
  messagingSenderId: "18416485348",
  appId: "1:18416485348:web:12176965505080897b3df1"
};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig);
}

const db = firebase.database();
const uid = localStorage.getItem("uid");

if(!uid){
window.location.href="index.html";
}

db.ref("users/"+uid).on("value",snap=>{
let d = snap.val() || {};
document.getElementById("balance").innerText = d.balance || 0;
document.getElementById("earnings").innerText = d.earnings || 0;
document.getElementById("points").innerText = d.points || 0;
});

function logout(){
localStorage.removeItem("uid");
window.location.href="index.html";
}
</script>

</body>
</html>
