<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanci-App | لوحة المستخدم</title>
<style>
body {margin:0; font-family:Arial; background:#0a0a0a; color:#fff;}
.container {max-width:600px; margin:auto; padding:20px;}
.logo {text-align:center; font-size:36px; color:gold; margin-bottom:20px;}
.user-box {background:#1c1c1c; padding:20px; border-radius:12px; margin-bottom:20px; text-align:center; box-shadow:0 0 20px rgba(255,215,0,0.3);}
.user-box h2{margin:10px 0;}
.logout-btn{background:red; color:#fff; padding:10px; border:none; border-radius:8px; cursor:pointer; margin-top:10px; width:100%;}
.games, .vouchers{margin-top:20px;}
.game-card, .voucher-card{background:#2c2c2c; padding:15px; border-radius:12px; margin-bottom:10px;}
.game-card button, .voucher-card button{background:gold; color:#000; border:none; padding:8px 12px; border-radius:8px; cursor:pointer;}
</style>
</head>
<body>
<div class="container">
  <div class="logo">Chanci-App</div>
  <div class="user-box">
    <h2 id="userName">مرحباً</h2>
    <p>الرصيد: <span id="balance">0</span></p>
    <p>الأرباح: <span id="earnings">0</span></p>
    <button class="logout-btn" onclick="userLogout()">تسجيل خروج</button>
  </div>

  <div class="games">
    <h3>الألعاب</h3>
    <div id="gamesList"></div>
  </div>

  <div class="vouchers">
    <h3>القسائم</h3>
    <div id="vouchersList"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBsx_iEGWKEDlEQe6B2rz4yqKAhGdz1uas",
  authDomain: "chanci-app.firebaseapp.com",
  databaseURL: "https://chanci-app-default-rtdb.firebaseio.com",
  projectId: "chanci-app",
  storageBucket: "chanci-app.firebasestorage.app",
  messagingSenderId: "18416485348",
  appId: "1:18416485348:web:12176965505080897b3df1",
  measurementId: "G-6YXX3SS61D"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// التحقق من المستخدم
const currentUser = localStorage.getItem("currentUser");
if(!currentUser || currentUser === "doktor"){
  window.location.href = "index.html";
}

// تحميل بيانات المستخدم
function loadUserData(){
  db.ref("users/"+currentUser).get().then(snapshot=>{
    if(snapshot.exists()){
      const data = snapshot.val();
      document.getElementById("userName").innerText = "مرحباً، "+currentUser;
      document.getElementById("balance").innerText = data.balance || 0;
      document.getElementById("earnings").innerText = data.earnings || 0;
    }
  });
}

// الألعاب
function loadGames(){
  db.ref("games").get().then(snapshot=>{
    const gamesList = document.getElementById("gamesList");
    gamesList.innerHTML = "";
    if(snapshot.exists()){
      const games = snapshot.val();
      Object.keys(games).forEach(g=>{
        const div = document.createElement("div");
        div.className = "game-card";
        div.innerHTML = "<strong>"+games[g].name+"</strong> - <button onclick='playGame(\""+g+"\")'>اللعب</button>";
        gamesList.appendChild(div);
      });
    } else {
      gamesList.innerHTML = "<p>لا توجد ألعاب متاحة حالياً</p>";
    }
  });
}

// القسائم
function loadVouchers(){
  db.ref("vouchers").get().then(snapshot=>{
    const vouchersList = document.getElementById("vouchersList");
    vouchersList.innerHTML = "";
    if(snapshot.exists()){
      const vouchers = snapshot.val();
      Object.keys(vouchers).forEach(v=>{
        const div = document.createElement("div");
        div.className = "voucher-card";
        div.innerHTML = "<strong>"+vouchers[v].code+"</strong> - قيمة: "+vouchers[v].amount+" <button onclick='redeemVoucher(\""+v+"\")'>استخدام</button>";
        vouchersList.appendChild(div);
      });
    } else {
      vouchersList.innerHTML = "<p>لا توجد قسائم حالياً</p>";
    }
  });
}

// دوال الألعاب والقسائم
function playGame(gameId){
  alert("اللعب في اللعبة: "+gameId+" (يمكنك تعديل هذا لاحقاً لإضافة اللعبة الحقيقية)");
}

function redeemVoucher(voucherId){
  const confirmRedeem = confirm("هل تريد استخدام القسيمة؟");
  if(!confirmRedeem) return;

  db.ref("vouchers/"+voucherId).get().then(snap=>{
    if(snap.exists()){
      const voucher = snap.val();
      // إضافة الرصيد للمستخدم
      db.ref("users/"+currentUser+"/balance").get().then(balanceSnap=>{
        let newBalance = (balanceSnap.val() || 0) + voucher.amount;
        db.ref("users/"+currentUser).update({balance: newBalance});
        alert("تم إضافة "+voucher.amount+" إلى رصيدك!");
        loadUserData();
      });
      // إزالة القسيمة بعد الاستخدام
      db.ref("vouchers/"+voucherId).remove();
      loadVouchers();
    }
  });
}

// تسجيل خروج
function userLogout(){
  localStorage.removeItem("currentUser");
  window.location.href = "index.html";
}

// تحميل البيانات عند فتح الصفحة
loadUserData();
loadGames();
loadVouchers();
</script>
</body>
</html>
