<!DOCTYPE html>  <html lang="ar" dir="rtl">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Chanci Dashboard</title>  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>  <style>  
  
/* ===== RESET ===== */  
*{  
margin:0;  
padding:0;  
box-sizing:border-box;  
font-family:Arial,sans-serif;  
}  
  
body{  
background:#050505;  
color:white;  
display:flex;  
min-height:100vh;  
}  
  
/* ===== SIDEBAR ===== */  
.sidebar{  
width:280px;  
background:#0d0d0d;  
border-left:1px solid rgba(255,215,0,.2);  
padding:20px;  
transition:0.3s;  
}  
  
.sidebar{  
transform: translateX(0);  
transition: transform 0.3s ease;  
}  
  
.sidebar.closed{  
transform: translateX(280px);  
}  
  
.profile{  
text-align:center;  
padding:20px;  
border:1px solid rgba(255,215,0,.2);  
border-radius:20px;  
margin-bottom:20px;  
}  
  
.avatar{  
width:90px;  
height:90px;  
border-radius:50%;  
margin:auto;  
background:#FFD700;  
margin-bottom:10px;  
}  
  
.username{  
font-size:24px;  
font-weight:bold;  
color:#FFD700;  
}  
  
.member{  
margin-top:10px;  
padding:10px;  
border-radius:10px;  
border:1px solid rgba(255,215,0,.3);  
}  
  
.menu-item{  
padding:15px;  
margin-bottom:10px;  
background:#141414;  
border-radius:12px;  
cursor:pointer;  
}  
  
/* ===== MAIN ===== */  
.main{  
flex:1;  
padding:20px;  
}  
  
.top-bar{  
display:flex;  
margin-bottom:15px;  
}  
  
.menu-btn{  
background:#FFD700;  
border:none;  
padding:10px 14px;  
font-size:20px;  
border-radius:10px;  
cursor:pointer;  
font-weight:bold;  
}  
.menu-btn{  
transition:0.2s;  
}  
  
.menu-btn:active{  
transform:scale(0.95);  
}  
/* ===== HERO ===== */  
.hero{  
height:260px;  
border-radius:25px;  
padding:30px;  
background:linear-gradient(135deg,#000,#111,#1a1a1a);  
border:1px solid rgba(255,215,0,.2);  
display:flex;  
align-items:center;  
justify-content:center;  
flex-direction:column;  
}  
  
.hero h1{  
font-size:60px;  
color:#FFD700;  
}  
  
.hero p{  
margin-top:10px;  
letter-spacing:3px;  
}  
  
/* ===== CARDS ===== */  
.cards{  
display:grid;  
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));  
gap:20px;  
margin-top:20px;  
}  
  
.card{  
background:#111;  
padding:20px;  
border-radius:20px;  
border:1px solid rgba(255,215,0,.15);  
}  
  
.card-title{  
color:#aaa;  
margin-bottom:10px;  
}  
  
.card-value{  
font-size:40px;  
font-weight:bold;  
color:#FFD700;  
}  
  
.actions{  
display:flex;  
gap:10px;  
margin-top:15px;  
}  
  
.btn{  
flex:1;  
padding:12px;  
border:none;  
border-radius:12px;  
font-weight:bold;  
cursor:pointer;  
}  
  
.deposit{  
background:#FFD700;  
color:#000;  
}  
  
.withdraw{  
background:#1d1d1d;  
color:#fff;  
border:1px solid #FFD700;  
}  
  
</style>  </head>  <body>  <!-- SIDEBAR -->  <div class="sidebar">  <div class="profile">  
<div class="avatar"></div>  
<div class="username" id="username">...</div>  
<div class="member">عضو ذهبي</div>  
  <div class="menu-item" onclick="logout()">  
تسجيل خروج  
</div>  
</div>  <div class="menu-item active">الرئيسية</div>  
<div class="menu-item">المحفظة</div>  
<div class="menu-item" onclick="openGame()">الألعاب</div>
<div class="menu-item">السحوبات</div>  
<div class="menu-item">الإعدادات</div>  </div>  <!-- MAIN -->  <div class="main">  <div class="top-bar">  
<button class="menu-btn" onclick="toggleSidebar()">☰</button>  
</div>  <div class="hero">  
<h1>CHANCI APP</h1>  
<p>PLAY • WIN • REDEEM</p>  
</div> 
  <!-- 🎮 GAME SECTION -->
<div id="game-section" style="display:none; padding:20px;">

  <h2 style="color:#FFD700; margin-bottom:10px;">🌳 GOLDEN TREE GAME</h2>

  <canvas id="gameCanvas" width="900" height="250" style="background:#111;border:2px solid gold;border-radius:15px;"></canvas>

  <canvas id="fxCanvas" style="position:fixed;top:0;left:0;pointer-events:none;"></canvas>

  <div style="margin-top:10px;">
    <input type="number" id="bet" placeholder="أدخل الرهان" style="padding:10px;border-radius:10px;">
    <button id="spin" style="padding:10px 20px;background:gold;border:none;border-radius:10px;font-weight:bold;">SPIN</button>
  </div>

  <div id="result" style="margin-top:10px;color:white;"></div>

</div>
  <div class="cards">  <div class="card">  
<div class="card-title">رصيد المحفظة</div>  
<div class="card-value" id="balance">0</div>  <div class="actions">  
<button class="btn deposit">إيداع</button>  
<button class="btn withdraw">سحب</button>  
</div>  
</div>  <div class="card">  
<div class="card-title">الأرباح</div>  
<div class="card-value" id="earnings">0</div>  
</div>  <div class="card">  
<div class="card-title">النقاط</div>  
<div class="card-value" id="points">0</div>  
</div>  <div class="card">  
<div class="card-title">مرات الفوز</div>  
<div class="card-value" id="wins">0</div>  
</div>  </div>  </div>  
<script>  function toggleSidebar(){
document.querySelector(".sidebar").classList.toggle("closed");
}
const currentUser =
localStorage.getItem("currentUser");

if(!currentUser){
window.location.href = "index.html";
}

document.getElementById("username").innerText =
currentUser;

firebase.initializeApp({
apiKey: "AIzaSyBsx_iEGWKEDlEQe6B2rz4yqKAhGdz1uas",
authDomain: "chanci-app.firebaseapp.com",
databaseURL: "https://chanci-app-default-rtdb.firebaseio.com",
projectId: "chanci-app",
storageBucket: "chanci-app.firebasestorage.app",
messagingSenderId: "18416485348",
appId: "1:18416485348:web:918a393569acb47a7b3df1"
});

const db = firebase.database();

db.ref("users/" + currentUser)
.on("value", snapshot=>{

const user = snapshot.val();

if(!user) return;

document.getElementById("balance").innerText =
user.balance || 0;

document.getElementById("earnings").innerText =
user.earnings || 0;

document.getElementById("points").innerText =
user.points || 0;

document.getElementById("wins").innerText =
user.wins || 0;

});
function openGame(){

  document.querySelector(".hero").style.display = "none";

  document.querySelector(".cards").style.display = "none";

  document.getElementById("game-section").style.display = "block";

}
function logout(){

localStorage.removeItem("currentUser");

window.location.href = "index.html";
}
</script>

</body>  
</html>
