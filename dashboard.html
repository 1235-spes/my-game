<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHANCI-APP</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

/* ---------- عام ---------- */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Cairo',sans-serif;
}

body{
  background:#050505;
  color:white;
  overflow-x:hidden;
}

/* زر القائمة ☰ */
.toggle-btn{
  position:fixed;
  top:20px;
  right:20px;
  z-index:1000;
  font-size:30px;
  background:#111;
  border:1px solid #ffbf3c;
  color:#ffbf3c;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  display:none;
}

/* ---------- التطبيق ---------- */
.app{
  display:flex;
  min-height:100vh;
}

/* ---------- الشريط الجانبي ---------- */
.sidebar{
  width:290px;
  background:#070707;
  border-left:1px solid rgba(255,190,50,.15);
  padding:20px;
  position:fixed;
  right:0;
  top:0;
  height:100vh;
  overflow-y:auto;
  transition:.4s;
}

/* إخفاء في الموبايل */
.sidebar.hide{
  right:-320px;
}

/* ---------- المحتوى ---------- */
.main{
  margin-right:290px;
  width:calc(100% - 290px);
  padding:20px;
  transition:.4s;
}

/* ---------- الموبايل ---------- */
@media(max-width:900px){

  .toggle-btn{
    display:block;
  }

  .sidebar{
    right:-320px;
  }

  .sidebar.active{
    right:0;
  }

  .main{
    margin-right:0;
    width:100%;
  }

}

/* ===== باقي ستايلك بدون تغيير ===== */

.profile{
  text-align:center;
  padding:20px;
  border-radius:24px;
  background:#0b0b0b;
  border:1px solid rgba(255,190,50,.15);
  margin-bottom:20px;
}

.avatar{
  width:100px;
  height:100px;
  margin:auto;
  border-radius:50%;
  border:2px solid #ffbf3c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  color:#ffbf3c;
}

.username{
  margin-top:15px;
  font-size:28px;
  font-weight:700;
  color:#ffcb52;
}

.menu-item{
  display:flex;
  justify-content:space-between;
  padding:18px;
  margin-bottom:12px;
  background:#0b0b0b;
  border-radius:18px;
  cursor:pointer;
}

/* باقي الكود عندك كما هو */

</style>
</head>

<body>

<!-- زر الثلاث خطوط -->
<div class="toggle-btn" onclick="toggleMenu()">☰</div>

<div class="app">

<!-- الشريط الجانبي -->
<div class="sidebar" id="sidebar">

  <div class="profile">
    <div class="avatar">👤</div>
    <div>مرحباً بك</div>
    <div class="username">Player123</div>
  </div>

  <div class="menu">
    <div class="menu-item">الرئيسية</div>
    <div class="menu-item">المحفظة</div>
    <div class="menu-item">الإيداع</div>
    <div class="menu-item">السحب</div>
    <div class="menu-item">الألعاب</div>
  </div>

</div>

<!-- المحتوى -->
<div class="main">

  <h1>CHANCI-APP</h1>

</div>

</div>

<script>
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("active");
}
</script>

</body>
</html>
<div class="crash-game">
  <h2>Crash Game</h2>
  <div class="multiplier-display">x1.00</div>
  
  <input type="number" id="betAmount" placeholder="أدخل رهانك" min="1" />
  
  <div>
    <button id="startBtn">ابدأ اللعبة</button>
    <button id="cashoutBtn" disabled>سحب</button>
  </div>

  <div style="margin-top:15px; color:#ffcb52;">
    رصيدك: <span id="userBalance">0</span>$
  </div>
</div>
