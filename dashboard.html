<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanci-App | Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
  body {
    margin:0;
    font-family:'Cairo',sans-serif;
    background:#0e0e0e;
    color:#fff;
  }

  /* زر الثلاث خطوط */
  .menu-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    font-size: 28px;
    cursor: pointer;
    z-index: 1100;
    background:#111;
    padding:8px 12px;
    border-radius:8px;
  }

  .container { display:flex; min-height:100vh; }

  /* SIDEBAR (مخفي افتراضيًا) */
  .sidebar {
    position: fixed;
    top:0;
    right:-260px;
    width:250px;
    height:100%;
    background:#111;
    display:flex;
    flex-direction:column;
    padding:20px;
    transition:0.3s;
    z-index:1200;
  }

  .sidebar.active {
    right:0;
  }

  .sidebar h2 {
    color:gold;
    text-align:center;
    margin-bottom:30px;
  }

  .sidebar a {
    text-decoration:none;
    color:#ccc;
    margin:10px 0;
    padding:12px;
    border-radius:8px;
    display:flex;
    align-items:center;
    transition:0.3s;
  }

  .sidebar a:hover {
    background:#222;
    color:gold;
  }

  .main {
    flex:1;
    padding:30px;
    overflow-y:auto;
  }

  .user-info {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
  }

  .logout button {
    background:gold;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
  }

  .stats { display:flex; gap:20px; margin-bottom:30px; }

  .card {
    background:#111;
    padding:20px;
    border-radius:15px;
    flex:1;
    text-align:center;
    box-shadow:0 0 20px rgba(255,215,0,0.2);
  }

  .card h3 { margin:0; font-size:24px; color:gold; }
  .card p { margin:5px 0 0; color:#aaa; }

  .sections {
    display:flex;
    gap:20px;
    flex-wrap:wrap;
  }

  .section-card {
    flex:1 1 200px;
    background:#111;
    padding:20px;
    border-radius:15px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
  }

  .section-card:hover { background:#222; }

  /* OVERLAY */
  .overlay {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    opacity:0;
    visibility:hidden;
    transition:0.3s;
    z-index:1000;
  }

  .overlay.active {
    opacity:1;
    visibility:visible;
  }

</style>
</head>

<body>

<!-- زر القائمة -->
<div class="menu-btn" onclick="toggleSidebar()">☰</div>

<!-- الشريط الجانبي -->
<div class="sidebar" id="sidebar">
  <h2>Chanci-App</h2>
  <a href="#">الرئيسية</a>
  <a href="#">المحفظة</a>
  <a href="#">الإيداع</a>
  <a href="#">السحب</a>
  <a href="#">الألعاب</a>
  <a href="#">القسائم</a>
  <a href="#">السحوبات</a>
  <a href="#">التاريخ</a>
  <a href="#">التوثيق</a>
  <a href="#">الإعدادات</a>
  <a href="#">دعم العملاء</a>
</div>

<!-- overlay -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="container">

  <div class="main">
    <div class="user-info">
      <div class="welcome">مرحباً بك، <span id="usernameDisplay">Player123</span></div>
      <div class="logout"><button onclick="logout()">تسجيل الخروج</button></div>
    </div>

    <div class="stats">
      <div class="card"><h3 id="balance">0</h3><p>الرصيد</p></div>
      <div class="card"><h3 id="points">0</h3><p>النقاط</p></div>
      <div class="card"><h3 id="wins">0</h3><p>الأرباح</p></div>
    </div>

    <div class="sections">
      <div class="section-card" onclick="openBox()">
        <img src="https://i.ibb.co/3N1K2M8/box.png" width="60">
        <span>فتح الصندوق</span>
        <p id="boxInfo">الفرص المتاحة للصندوق: 0</p>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "API_KEY_HERE",
  authDomain: "PROJECT_ID.firebaseapp.com",
  databaseURL: "https://PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "PROJECT_ID",
  storageBucket: "PROJECT_ID.appspot.com",
  messagingSenderId: "SENDER_ID",
  appId: "APP_ID"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const currentUser = localStorage.getItem('currentUser');
document.getElementById('usernameDisplay').innerText = currentUser;

/* sidebar control */
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("active");
  document.getElementById("overlay").classList.toggle("active");
}

function closeSidebar(){
  document.getElementById("sidebar").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

/* close on ESC (اختياري احترافي) */
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeSidebar();
});

/* Firebase */
database.ref('users/' + currentUser).get().then(snapshot => {
  if(snapshot.exists()){
    const data = snapshot.val();
    document.getElementById('balance').innerText = data.balance;
    document.getElementById('points').innerText = data.points;
    document.getElementById('wins').innerText = data.wins;
  }
});

function logout() {
  localStorage.removeItem('currentUser');
  window.location.href = 'index.html';
}

/* BOX SYSTEM */
async function openBox() {
  const boxInfo = document.getElementById('boxInfo');
  const userRef = database.ref('users/' + currentUser);
  const snapshot = await userRef.get();
  if (!snapshot.exists()) return;

  let userData = snapshot.val();
  const spentUnits = userData.spentUnits || 0;
  const opportunities = Math.floor(spentUnits / 100000);
  const usedOpportunities = userData.usedBox || 0;
  const remaining = opportunities - usedOpportunities;

  if (remaining <= 0) {
    boxInfo.innerText = "لا توجد فرص.";
    return;
  }

  const pointsGained = Math.floor(Math.random() * 50001);
  const newPoints = userData.points + pointsGained;

  await userRef.update({
    points: newPoints,
    usedBox: usedOpportunities + 1
  });

  document.getElementById('points').innerText = newPoints;
  boxInfo.innerText = `+${pointsGained} نقطة`;
}
</script>

</body>
</html>
