<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanci-App | Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:'Cairo',sans-serif; background:#0e0e0e; color:#fff; }
  .container { display:flex; min-height:100vh; }
  .sidebar { width:250px; background:#111; display:flex; flex-direction:column; padding:20px; }
  .sidebar h2 { color:gold; text-align:center; margin-bottom:30px; }
  .sidebar a { text-decoration:none; color:#ccc; margin:10px 0; padding:12px; border-radius:8px; display:flex; align-items:center; transition:0.3s; }
  .sidebar a:hover { background:#222; color:gold; }
  .main { flex:1; padding:30px; overflow-y:auto; }
  .user-info { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
  .user-info .welcome { font-size:20px; }
  .user-info .logout button { background:gold; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:bold; transition:0.3s; }
  .user-info .logout button:hover { background:#ffd700; }
  .stats { display:flex; gap:20px; margin-bottom:30px; }
  .card { background:#111; padding:20px; border-radius:15px; flex:1; text-align:center; box-shadow:0 0 20px rgba(255,215,0,0.2); }
  .card h3 { margin:0; font-size:24px; color:gold; }
  .card p { margin:5px 0 0; color:#aaa; }
  .sections { display:flex; gap:20px; margin-bottom:30px; flex-wrap:wrap; }
  .section-card { flex:1 1 200px; background:#111; padding:20px; border-radius:15px; text-align:center; cursor:pointer; transition:0.3s; box-shadow:0 0 20px rgba(255,215,0,0.2); }
  .section-card img { width:60px; margin-bottom:10px; }
  .section-card:hover { background:#222; }
  .section-card span { display:block; margin-top:10px; }
  .section-card p { margin-top:10px; color:#ccc; font-size:14px; }
</style>
</head>
<body>
<div class="container">
  <div class="sidebar">
    <h2>Chanci-App</h2>
    <a href="#">الرئيسية</a>
    <a href="#">المحفظة</a>
    <a href="#">الإيداع</a>
    <a href="#">السحب</a>
    <a href="#">الألعاب</a>
    <a href="#">القسائم</a>
    <a href="#">السحوبات</a>
    <a href="#">التاريخ</a>
    <a href="#">التوثيق</a>
    <a href="#">الإعدادات</a>
    <a href="#">دعم العملاء</a>
  </div>
  <div class="main">
    <div class="user-info">
      <div class="welcome">مرحباً بك، <span id="usernameDisplay">Player123</span></div>
      <div class="logout"><button onclick="logout()">تسجيل الخروج</button></div>
    </div>
    <div class="stats">
      <div class="card"><h3 id="balance">0</h3><p>الرصيد</p></div>
      <div class="card"><h3 id="points">0</h3><p>النقاط</p></div>
      <div class="card"><h3 id="wins">0</h3><p>الأرباح</p></div>
    </div>
    <div class="sections">
      <div class="section-card" onclick="openBox()">
        <img src="https://i.ibb.co/3N1K2M8/box.png" alt="الصندوق">
        <span>فتح الصندوق</span>
        <p id="boxInfo">الفرص المتاحة للصندوق: 0</p>
      </div>
      <div class="section-card" onclick="openGames()">
        <img src="https://i.ibb.co/2yLqH9F/gamepad.png" alt="الألعاب">
        <span>الألعاب</span>
      </div>
      <div class="section-card" onclick="openCoupons()">
        <img src="https://i.ibb.co/NY0bXy2/coupon.png" alt="القسائم">
        <span>القسائم</span>
      </div>
      <div class="section-card" onclick="openWheel()">
        <img src="https://i.ibb.co/bW6xGk7/wheel.png" alt="السحوبات">
        <span>السحوبات</span>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "API_KEY_HERE",
  authDomain: "PROJECT_ID.firebaseapp.com",
  databaseURL: "https://PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "PROJECT_ID",
  storageBucket: "PROJECT_ID.appspot.com",
  messagingSenderId: "SENDER_ID",
  appId: "APP_ID"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// جلب المستخدم الحالي
const currentUser = localStorage.getItem('currentUser');
document.getElementById('usernameDisplay').innerText = currentUser;

// عرض البيانات
database.ref('users/' + currentUser).get().then(snapshot => {
  if(snapshot.exists()){
    const data = snapshot.val();
    document.getElementById('balance').innerText = data.balance;
    document.getElementById('points').innerText = data.points;
    document.getElementById('wins').innerText = data.wins;
  }
});

// تسجيل الخروج
function logout() {
  localStorage.removeItem('currentUser');
  window.location.href = 'index.html';
}

// الصندوق: نقاط من 0 إلى 50000
async function openBox() {
  const boxInfo = document.getElementById('boxInfo');
  const userRef = database.ref('users/' + currentUser);
  const snapshot = await userRef.get();
  if (!snapshot.exists()) return;

  let userData = snapshot.val();
  const spentUnits = userData.spentUnits || 0;
  const opportunities = Math.floor(spentUnits / 100000);
  const usedOpportunities = userData.usedBox || 0;
  const remaining = opportunities - usedOpportunities;

  if (remaining <= 0) {
    boxInfo.innerText = "لا توجد فرص متاحة الآن. أنفق 100,000 وحدة للحصول على فرصة جديدة.";
    return;
  }

  const pointsGained = Math.floor(Math.random() * 50001); // 0-50000
  const newPoints = userData.points + pointsGained;

  await userRef.update({
    points: newPoints,
    usedBox: usedOpportunities + 1
  });

  document.getElementById('points').innerText = newPoints;
  boxInfo.innerText = `تم فتح الصندوق! حصلت على ${pointsGained} نقطة. الفرص المتبقية: ${remaining - 1}`;
}

// تحديث الفرص المتاحة عند التحميل
async function updateBoxInfo() {
  const boxInfo = document.getElementById('boxInfo');
  const snapshot = await database.ref('users/' + currentUser).get();
  if (!snapshot.exists()) return;

  const userData = snapshot.val();
  const spentUnits = userData.spentUnits || 0;
  const opportunities = Math.floor(spentUnits / 100000);
  const usedOpportunities = userData.usedBox || 0;
  const remaining = opportunities - usedOpportunities;

  boxInfo.innerText = `الفرص المتاحة للصندوق: ${remaining}`;
}
updateBoxInfo();

// دوال الأقسام التجريبية
function openGames(){ alert('فتح الألعاب'); }
function openCoupons(){ alert('فتح القسائم'); }
function openWheel(){ alert('فتح السحوبات'); }
</script>
</body>
</html>
