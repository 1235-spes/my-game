<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonus Frenzy Slots</title>
  <link rel="stylesheet" href="bonus-frenzy.css">
</head>
<body>
  <div id="bonusIntro" class="bonus-intro hidden">

    <div class="bonus-intro-box">

        <h1>BONUS</h1>

        <h2 id="bonusSpinsText">
            10 FREE SPINS
        </h2>

    </div>

  </div>
<div class="game-container">
  <div id="game-section">
    <h1 class="game-title">
        <div class="jackpot-top">
  ♠️ <span id="jp1">0</span>
  ♣️ <span id="jp2">0</span>
  ♦️ <span id="jp3">0</span>
  ♥️ <span id="jp4">0</span>
        </div>
  <img src="../images/gogo.jpg" alt="Golden Tree Logo" class="game-logo">
</h1>
    
    <div class="reels">
<canvas id="paylineCanvas"></canvas>
  <div class="reel" id="reel1">
    <div class="reel-strip"></div>
  </div>

  <div class="reel" id="reel2">
    <div class="reel-strip"></div>
  </div>

  <div class="reel" id="reel3">
    <div class="reel-strip"></div>
  </div>

  <div class="reel" id="reel4">
    <div class="reel-strip"></div>
  </div>

  <div class="reel" id="reel5">
    <div class="reel-strip"></div>
  </div>

    </div>
    <div class="status-panel">

    <div class="status-box">
        <div class="status-title">BALANCE</div>
        <div class="status-value" id="balance">0</div>
    </div>

    <div class="status-box">
        <div class="status-title">BET</div>
        <div class="status-value" id="bet">300</div>
    </div>

    <div class="status-box">
        <div class="status-title">WIN</div>
        <div class="status-value" id="winAmount">0</div>
    </div>

    </div>
<!-- ===== CONTROLS ===== -->
<div class="controls">

  <div class="left-controls">
      <button id="betToggle">💰</button>
      <button id="bonusBtn">⚙</button>
  </div>

  <button id="spin" class="spin-btn">
      <img src="../images/Zr.jpg" alt="Spin">
  </button>

  <div class="right-controls">
      <button id="speedBtn">⚡</button>
      <button id="autoSpinBtn">🔄</button>
  </div>

</div>

<!-- ===== BET MENU ===== -->
<div id="betMenu" class="bet-menu hidden">
  <button data-tab="1">1</button>
  <button data-tab="2">2</button>
  <button data-tab="3">3</button>
  <button data-tab="4">4</button>
</div>

<div class="bet-box" data-box="1">
  <button data-bet="300">300</button>
  <button data-bet="600">600</button>
  <button data-bet="1200">1200</button>
  <button data-bet="1500">1500</button>
  <button data-bet="2000">2000</button>
</div>

<div class="bet-box" data-box="2">
  <button data-bet="3000">3000</button>
  <button data-bet="6000">6000</button>
  <button data-bet="12000">12000</button>
  <button data-bet="15000">15000</button>
  <button data-bet="30000">30000</button>
</div>

<div class="bet-box" data-box="3">
  <button data-bet="60000">60000</button>
  <button data-bet="120000">120000</button>
  <button data-bet="200000">200000</button>
  <button data-bet="300000">300000</button>
  <button data-bet="600000">600000</button>
</div>

<div class="bet-box" data-box="4">
  <button data-bet="1200000">1200000</button>
  <button data-bet="1500000">1500000</button>
</div>

<!-- ===== SPEED MENU ===== -->
<div id="speedMenu" class="speed-menu hidden">
  <button data-speed="6000">Slow</button>
  <button data-speed="4000">Normal</button>
  <button data-speed="2500">Fast</button>
</div>

<!-- ===== AUTO SPIN MENU (VERTICAL) ===== -->
<div id="autoMenu" class="auto-menu hidden">
  <button data-spin="10">10</button>
  <button data-spin="20">20</button>
  <button data-spin="50">50</button>
  <button data-spin="100">100</button>
</div>
    
<div id="bonusMenu" class="bonus-menu hidden">

<h3>شراء Bonus</h3>

<button data-cost="3000" data-spins="10">
شراء Bonus 10 Spins
</button>

<button data-cost="6000" data-spins="20">
شراء Bonus 20 Spins
</button>

<button data-cost="15000" data-spins="50">
شراء Bonus 50 Spins
</button>

</div>

</body>
</html>
