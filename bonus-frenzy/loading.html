<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>

  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: gold;
      font-family: Arial;
      flex-direction: column;
    }

    .logo {
      width: 150px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 10px gold);
    }

    .bar {
      width: 200px;
      height: 10px;
      border: 1px solid gold;
      border-radius: 10px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: gold;
      transition: 0.2s;
    }

    .text {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <img src="../images/logo.png" class="logo">

  <div class="bar">
    <div class="fill" id="fill"></div>
  </div>

  <div class="text">جاري تحميل اللعبة...</div>

  <script>
    let progress = 0;
    const fill = document.getElementById("fill");

    let interval = setInterval(() => {
      progress += 2;
      fill.style.width = progress + "%";

      if (progress >= 100) {
        clearInterval(interval);

        setTimeout(() => {
          window.location.href = "game.html"; // 👈 رابط اللعبة
        }, 500);
      }
    }, 30);
  </script>

</body>
</html>
