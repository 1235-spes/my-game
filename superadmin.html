<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Super Admin</title>
</head>
<body>

<div class="header">
  لوحة السوبر ادمن
</div>

<div class="container">

  <!-- زر خروج -->
  <button class="btn logout-btn" onclick="logout()">تسجيل خروج</button>

  <!-- رصيد السوبر -->
  <div class="stat-card">
    رصيدك: <span id="balance">0</span>
  </div>

  <!-- إنشاء لاعب -->
  <div class="create-user">
    <h2>إنشاء لاعب</h2>

    <input id="newUser" class="input" placeholder="اسم اللاعب">
    <input id="newPass" class="input" placeholder="كلمة المرور">
    <input id="newBalance" class="input" type="number" placeholder="الرصيد">

    <button class="btn btn-create" onclick="createUser()">
      إنشاء لاعب
    </button>
  </div>

  <!-- اللاعبين -->
  <h2 style="color:#FFD700;">لاعبيّ</h2>
  <div class="users-grid" id="usersList"></div>

  <div id="status" class="status"></div>
</div>
<script src="superadmin.js"></script>
